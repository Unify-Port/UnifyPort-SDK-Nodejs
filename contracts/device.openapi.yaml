openapi: 3.1.0
info:
  title: UnifyPort Device API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: UnifyPort Device API 提供统一的多渠道账号接入与业务操作能力，涵盖账号授权与管理、 消息、会话、联系人、群组和 Webhook 等功能。 对外响应及 Webhook
    中表示绝对时刻的时间字段使用 RFC 3339 格式，并规范化为 UTC `Z`； 客户端展示时可转换为用户所在时区。请求中的时间字段按各接口说明接受带时区的 RFC 3339 值。 `/v1/`
    下的接口默认使用 `X-Api-Key` 鉴权；具体请求参数、响应结构和渠道支持范围以各接口说明为准。
servers:
  - url: /
    description: API 基础地址，实际地址以当前环境提供的接入信息为准。
tags:
  - name: Workspace
    description: 当前 API Key 所属 workspace。
  - name: API Keys
    description: workspace API Key 管理。
  - name: Providers
    description: 查询可用渠道及其元数据。
  - name: Accounts
    description: 管理渠道账号资源。
  - name: Account Auth
    description: 完成渠道账号授权。
  - name: Account Runtime
    description: 管理渠道账号运行状态。
  - name: Posts
    description: 当前登录账号的帖子、一级评论查询和回复。
  - name: Conversations
    description: 会话列表、详情、成员、历史补拉、读写状态、静音、置顶与标签。
  - name: Contacts
    description: 查询联系人及执行联系人操作。
  - name: Groups
    description: 查询群组及执行群组操作。
  - name: Messages
    description: 统一消息发送与消息动作。
  - name: Calls
    description: 仅内测工作区可准备、查询和结束 WhatsApp 单聊语音或视频通话；呼入暂未开放。
  - name: Webhook Endpoints
    description: 管理 Webhook 接收地址。
security:
  - ApiKeyAuth: []
paths:
  /v1/calls:
    post:
      tags:
        - Calls
      summary: 准备主动通话
      operationId: createCall
      description: 仅 is_beta=true 的内测工作区可用；普通工作区返回 403 beta_feature_not_enabled（41002）。呼入暂未开放，内测资格不会自动开启呼入。 为
        WhatsApp 账号准备单聊语音或视频呼叫。创建成功仅表示准备完成，不会立即拨号。 to 与发送消息使用相同的 {id,type} 结构；id 填当前账号下的 conversation_id，type
        填会话类型。 首期仅支持 WhatsApp 的 user 目标，id 必须是数字用户标识组成的 @lid 或 @s.whatsapp.net 单聊 JID，最长 128 字符；不支持裸手机号或字符串形式的
        to。 group、channel 及其他尚未支持通话的渠道返回 501 unsupported_by_provider；WhatsApp user 目标 JID 无效返回 400
        provider_invalid_request。 用户在 expires_at 前打开 join_url，允许麦克风并点击 Start call，媒体连接后才开始拨号。
        视频通话的摄像头可选；未允许摄像头时仍可收看远端视频和语音通话。 一个账号最多同时保留一通活跃通话；准备期从创建通话起默认 2 分钟，可由服务端调整，实际截止时间以 expires_at
        为准，过期后需重新创建。此期限不限制已接通通话的时长。 join_url 是短期一次性访问链接，应原样传递给预期用户，禁止写入日志或公开分享。 接通和结束通过
        call.answered、call.ended 事件通知；内测工作区可使用通配订阅或逐项订阅，外呼不会产生 call.incoming。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCallRequest"
            example:
              account_id: acc_example
              to:
                id: 100000000000002@lid
                type: user
              media_type: video
      responses:
        "201":
          description: 已生成准备态通话，尚未拨号。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/CreateCallData"
              example:
                request_id: req_example
                data:
                  call_id: call_example
                  direction: outbound
                  media_type: video
                  state: preparing
                  join_url: https://calls.example.com/call/call_example#ticket=example-only
                  expires_at: 2026-09-07T12:02:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 目标工作区未开通内测时返回 beta_feature_not_enabled（41002）；当前 API Key 无权切换到目标工作区时仍返回原鉴权错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: beta_feature_not_enabled
                  numeric_code: "41002"
                  message: Beta feature not enabled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 账号已有活跃通话、尚未绑定节点或当前运行实例未就绪；遇到 38000 可先查询 GET /v1/calls/active，再按需调用 POST
            /v1/calls/{call_id}/hangup；也可等待当前通话结束或准备过期后重试。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                activeCall:
                  value:
                    request_id: req_example
                    error:
                      code: call_already_active
                      numeric_code: "38000"
                      message: Account already has an active call
                missingBinding:
                  value:
                    request_id: req_example
                    error:
                      code: account_binding_not_found
                      numeric_code: "30006"
                      message: Account is not bound to an available server
                instanceMissing:
                  value:
                    request_id: req_example
                    error:
                      code: provider_not_ready
                      numeric_code: "30014"
                      message: Provider instance is missing
                runtimeStopped:
                  value:
                    request_id: req_example
                    error:
                      code: provider_not_ready
                      numeric_code: "30015"
                      message: Provider runtime is stopped
        "500":
          description: 通话准备失败或发生内部处理错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: create_call_failed
                  numeric_code: "38002"
                  message: Failed to create call
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 通话服务当前不可用，稍后重试；未知渠道故障仍使用既有 502 分类。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: call_service_unavailable
                  numeric_code: "38001"
                  message: Call service unavailable
  /v1/calls/active:
    get:
      tags:
        - Calls
      summary: 查询账号当前活动通话
      operationId: getActiveCall
      description: 仅内测工作区可用，普通工作区返回 403 beta_feature_not_enabled（41002）。当前账号没有活动通话时返回 200 且 data 为空对象
        {}；这不表示通话服务不可用。有活动通话时仅返回通话 ID、状态、方向和媒体类型，不返回链接或凭证。
      parameters:
        - in: query
          name: account_id
          required: true
          schema:
            type: string
            pattern: ^acc_[A-Za-z0-9][A-Za-z0-9_-]*$
          example: acc_example
      responses:
        "200":
          description: 当前活动通话或空对象 {}。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/ActiveCallData"
                          - type: object
                            maxProperties: 0
              examples:
                active:
                  value:
                    request_id: req_example
                    data:
                      call_id: call_example
                      state: active
                      direction: inbound
                      media_type: voice
                idle:
                  value:
                    request_id: req_example
                    data: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 目标工作区未开通内测时返回 beta_feature_not_enabled（41002）；当前 API Key 无权访问目标工作区时仍返回原鉴权错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: beta_feature_not_enabled
                  numeric_code: "41002"
                  message: Beta feature not enabled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 通话查询失败，错误码 call_control_failed / 38004。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: call_control_failed
                  numeric_code: "38004"
                  message: Failed to control call
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 通话服务不可用，错误码 call_service_unavailable / 38001。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/calls/{call_id}/hangup:
    post:
      tags:
        - Calls
      summary: 挂断指定通话
      operationId: hangupCall
      description: 仅内测工作区可用，普通工作区返回 403
        beta_feature_not_enabled（41002）。挂断当前账号归属的指定通话。存储保留期内重复挂断已结束通话仍返回其终态对象；通话不存在或不属于该账号返回 404
        call_not_found。撤销内测资格前应先结束活动通话并等待准备链接过期；资格撤销不会立即使已发链接失效或强制结束通话。
      parameters:
        - in: path
          name: call_id
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
            maxLength: 128
          example: call_example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
              properties:
                account_id:
                  type: string
                  pattern: ^acc_[A-Za-z0-9][A-Za-z0-9_-]*$
            example:
              account_id: acc_example
      responses:
        "200":
          description: 已结束通话的终态对象。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/EndedCallData"
              example:
                request_id: req_example
                data:
                  call_id: call_example
                  state: ended
                  direction: outbound
                  media_type: voice
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 目标工作区未开通内测时返回 beta_feature_not_enabled（41002）；当前 API Key 无权访问目标工作区时仍返回原鉴权错误。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: beta_feature_not_enabled
                  numeric_code: "41002"
                  message: Beta feature not enabled
        "404":
          description: 通话不存在或不属于该账号，错误码 call_not_found / 38003；账号不存在仍沿用 account_not_found。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_example
                error:
                  code: call_not_found
                  numeric_code: "38003"
                  message: Call not found
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 通话挂断失败，错误码 call_control_failed / 38004。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          description: 通话服务不可用，错误码 call_service_unavailable / 38001。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/workspace:
    get:
      tags:
        - Workspace
      summary: 获取当前 workspace
      operationId: getWorkspace
      responses:
        "200":
          description: 当前 workspace 信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Workspace
      summary: 更新当前 workspace
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: 更新后的 workspace 信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/api-keys:
    get:
      tags:
        - API Keys
      summary: 列出 API Key
      operationId: listApiKeys
      responses:
        "200":
          description: API Key 列表。不会返回完整明文 API Key。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - API Keys
      summary: 创建 API Key
      operationId: createApiKey
      description: 完整 `api_key` 只在创建响应中出现一次，客户端应自行保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
            examples:
              default:
                value:
                  name: Example
                  prefix: dk_live
      responses:
        "201":
          description: 创建成功，返回一次性明文 API Key 与可持久展示的 Key 元数据。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKeyCreateResult"
              examples:
                created:
                  value:
                    request_id: req_xxx
                    data:
                      key:
                        id: ak_xxx
                        name: Example
                        key_prefix: dk_live
                        status: active
                      api_key: <api-key-visible-once>
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/api-keys/{key_id}:
    patch:
      tags:
        - API Keys
      summary: 更新 API Key 状态
      operationId: updateApiKeyStatus
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyStatusUpdateRequest"
      responses:
        "200":
          description: 更新后的 API Key 元数据。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/api-keys/{key_id}/rotate:
    post:
      tags:
        - API Keys
      summary: 轮换 API Key
      operationId: rotateApiKey
      description: 轮换后返回新的完整 `api_key`，旧完整密钥不可恢复。
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "200":
          description: 轮换成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKeyCreateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/providers/{provider}/regions:
    get:
      tags:
        - Providers
      summary: 查询 provider 地区可用性
      operationId: listProviderRegions
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: 渠道支持的 `region` 及其可分配状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ProviderRegionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account-operations/{operation_id}:
    get:
      tags:
        - Accounts
      summary: 查询账号计费操作
      operationId: getAccountOperation
      description: 只返回当前 API Key 工作区的安全业务结果。REVIEW 表示结果尚未确认，不代表已经退款。 创建成功后应复用原账号并查询本操作；没有提供幂等键的后续请求会视为新的建号。
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 当前操作状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountOperation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 操作不存在或不属于当前工作区，account_operation_not_found（20029）。
        "503":
          description: 钱包服务暂不可用，wallet_unavailable（20028）。
  /v1/accounts:
    get:
      tags:
        - Accounts
      summary: 列出账号
      description: "按稳定顺序分页返回当前 workspace 未删除的账号，账号数组位于
        `data.items`。额度删除完成或余额删除受理后，该账号立即不再出现在列表及后续分页中。省略分页参数时只返回第一页，默认最多 20 个账号。 `data.has_more=true` 时，将
        `data.next_cursor` 原样作为下一次请求的 `cursor`；续页可调整 `limit`。末页 `data.has_more=false` 且省略
        `data.next_cursor`，空结果返回 `data.items: []`。 游标仅适用于签发时的
        workspace，调用方不得解析或构造游标。分页期间新创建的账号需重新读取首页查看；跨页查询不提供时间点快照。 `limit` 非法、`cursor` 非法或跨 workspace 使用，以及重复传入
        `limit` 或 `cursor`，均返回 `400 invalid_request`（`numeric_code=10000`）。"
      operationId: listAccounts
      parameters:
        - $ref: "#/components/parameters/AccountsLimit"
        - $ref: "#/components/parameters/AccountsCursor"
      responses:
        "200":
          description: 当前 workspace 下的一页账号。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountListResult"
              examples:
                lastPage:
                  summary: 最后一页
                  value:
                    request_id: req_example_accounts
                    data:
                      items:
                        - id: acc_example_support
                          name: Example
                          provider: whatsapp
                          region: sg
                          status: active
                          runtime_status: running
                      has_more: false
                emptyPage:
                  summary: 无账号
                  value:
                    request_id: req_example_empty_accounts
                    data:
                      items: []
                      has_more: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Accounts
      summary: 创建账号
      description: "`region` 表示默认网络出口地区；指定自定义 `proxy` 时沿用原代理规则。已有账号不会因默认分配策略调整而迁移。 额度和余额模式没有合格默认容量时可能返回 409
        `egress_region_unavailable`（20031）；配置暂不可确认返回 409 `egress_configuration_pending`（20032）；默认分配暂时关闭返回 503
        `network_maintenance`（20035）。 额度模式创建不提供请求去重或历史结果重放；响应结果不明时请先核对账号列表，避免重复创建。
        额度模式兼容原请求；余额模式直接创建，在同一事务内按当前梯度核价并扣款，不需要报价接口。 余额模式优先使用所选地区的直连容量；没有直连候选且未指定自定义 `proxy`
        时，Telegram、WhatsApp 和 WhatsApp Protocol TCP 可使用已启用的平台代理补充。未开放的渠道仍沿用原分配规则。
        代理分配与核价扣款原子提交；分配竞争或配置不可用不会自动改选其他候选。删除或退款完成不保证该地区立即有新容量。 同一工作区同步建号执行中，第二笔请求立即返回 409
        wallet_account_creation_in_progress（20030）；请等待前一笔完成。 Idempotency-Key
        可选。同工作区同键同参数返回原账号和周期，不重复扣款；同键异请求返回冲突。 未传幂等键时，前一笔完成后的再次请求视为新建号；调用方负责避免重复提交。
        有键重试返回首次创建的安全身份与周期快照，即使账号随后删除也不会再次建号或扣款；当前状态请查询原操作。 新建事务提交后计时 720 小时，必要配置异步执行；返回账号不代表已完成渠道授权。
        未扫码、重新授权、掉线和重连均不重新扣款或重置周期。本版不执行自动续费或到期停服。 余额不足返回 409 wallet_insufficient_funds（20023）；同键异请求返回 409
        wallet_idempotency_conflict（20024）。 新消费关闭返回 409 wallet_workspace_disabled（20022）；资金或配置不可用返回 503
        wallet_unavailable（20028）。"
      operationId: createAccount
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 可选；提供后在工作区范围内唯一，重试时保持同值和同一请求参数。
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: 创建成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/accounts/{account_id}:
    get:
      tags:
        - Accounts
      summary: 获取账号详情
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: 账号详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Accounts
      summary: 更新账号
      operationId: updateAccount
      description: 实际改变 `auth_mode` 时，请求体必须仅包含该字段，目标模式必须为该渠道支持的方式。
        同一账号须串行切换：先暂停授权（含二维码轮询）、运行、配置及删除操作并等待在途请求处理结束，切换完成后再继续；切换不能撤回已发给渠道的请求。 实际变更 `provider`
        时也须暂停同账号其他业务操作并等待在途请求处理结束；变更请求处理结束且结果确认后再恢复。失败或超时导致处理状态或结果不确定时保持暂停，先确认后继续。原样回传当前 `provider` 不增加该串行要求。
        切换至 `code` 前须先保存手机号；缺少手机号返回 400 `auth_mode_phone_required`。 Telegram、WhatsApp
        实际切换会清除旧会话，包括已授权会话；完成后旧授权会话记录统一为 `cancelled`，临时材料清空，调用方应重新授权。 成功后保存目标模式，授权状态为 `pending_auth`，运行状态为
        `stopped`；不自动启动授权或连接。 提交与当前相同的模式保留当前授权进度和临时材料，不重启授权；其他字段仍按普通部分更新处理。
        清理失败时不提交目标模式，但远端会话可能已经清除；可重试仅包含同一目标 `auth_mode` 的 PATCH。
        清理失败或切换结果未确认（包括超时）时仍须暂停上述操作，直到同一目标模式切换完成；提交当前模式的无操作成功不表示未决切换已完成。
        请求明确在参数校验阶段被拒绝且没有此前未完成的切换时，可修正参数或补齐配置后重新发起。 切换冲突返回 409
        `provider_not_ready`。成功响应继续使用原账号结构，授权状态通过既有授权查询读取。 TikTok 账号更新无法安全完成或被中断时返回 502 provider_unavailable。
        收到该错误后先重新查询账号状态，再决定是否重新提交更新。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdateRequest"
      responses:
        "200":
          description: 更新后的账号。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags:
        - Accounts
      summary: 删除账号
      operationId: deleteAccount
      description: WhatsApp 账号删除前会实时确认设备状态。未连接或已停止时完成平台侧清理， 不保证 WhatsApp 侧的登录会话已注销；在线时先退登再清理。 删除过程中确认设备已不存在时按已删除处理。
        额度账号删除完成后、余额账号删除受理后，账号立即从当前账号列表中消失。余额账号先在事务内受理并禁用；返回202与同一个DELETE操作，完成后重复删除返回204。
        结算按受理锁下本平台已落库的授权成功记录冻结：无记录且不足24小时全退，其他按剩余完整天计算。 已扫码但回调未落库同样视为无记录；迟到回调不改结算、不二退、不恢复账号。未知HTTP或清理失败不会伪报成功。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "202":
          description: 余额删除已受理且不可撤回；清理或退款仍处理中，重复请求复用原操作。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountOperation"
        "204":
          description: 账号删除操作达到期望终态，无响应体。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

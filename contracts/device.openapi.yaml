      summary: 新评论事件
      description: 支持符合识别与当前账号帖子归属条件的 post.comment.created；需确认接入环境已开放通知后启用。
        通知范围有限，不保证覆盖所有评论和回复；未知通知不作为公开事件。parent_comment_id 仅在父子关系可靠时提供，缺失不能证明一级评论或可回复目标。
        回复时应确认通知评论属于目标帖子的一级评论；回复接口不预先确认其所属帖子或层级，不能仅凭通知字段缺失认定可回复。 评论轮询默认关闭。provider_data.enable_comment=true
        后需启动或重连生效；在线账号修改配置必须重连，start 成功不证明配置已更新。 尽力而为通知可能延迟、重复、乱序或遗漏，不保证实时、完整历史或每条评论都有事件；接收方按事件 id 去重。 精确订阅需包含
        post.comment.created，空订阅和 * 会包含该类型；订阅本身不会开启轮询。 已开启轮询且具有匹配订阅的账号，在环境开放后可能开始收到该事件；启用前须核对现有配置与接收端处理能力。
      operationId: receivePostCommentCreatedWebhookEvent
      requestBody:
        required: true

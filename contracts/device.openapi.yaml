  /v1/accounts/{account_id}/auth/start:
    post:
      tags:
        - Account Auth
      summary: 启动验证码类授权
      operationId: startAccountAuth
      description: 启动 `auth_mode=code` 的授权流程。通常发送 `{}`，手机号从账号的 `provider_data.phone` 读取。 WhatsApp 手机号配对从
        `data.verify_code` 读取配对码，交由用户在手机端输入， 不调用 `/auth/code`。Telegram 等待用户收到验证码后调用 `/auth/code`， 如需二次密码再调用
        `/auth/password`。 `awaiting_code` 仅表示等待用户操作，不代表授权成功；通过 `GET /auth` 查询后续授权状态，并在发送消息前确认账号连接可用。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/StartCodeAuthResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/auth/qr/start:
    post:
      tags:
        - Account Auth
      summary: 启动二维码授权
      operationId: startAccountQrAuth
      description: TikTok 可在 body 临时传入 Boolean enable_comment 覆盖账号配置；缺省 false，非法类型返回 400 invalid_request。
        显式启动或继续二维码授权。WhatsApp Provider 返回 `init` 或尚未生成二维码时， 响应保持 `pending`，不会伪装成可扫码状态。 Provider 已进入 Passkey
        时会继续现有流程；响应只保留标准 `auth_payload`， 不返回 Provider 原始 `code`、`info` 或二维码兼容字段。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/auth/qr/check:
    post:
      tags:
        - Account Auth
      summary: 检查二维码授权结果
      operationId: checkAccountQrAuth
      description: 轮询二维码授权状态。普通二维码步骤通过 `auth_payload.qr_code` 返回二维码； WhatsApp 授权也可能进入 `passkey_required`，此时调用方应使用
        `auth_payload.public_key` 发起 WebAuthn 操作，而不能继续把响应当作二维码。 渠道历史兼容字段可能随普通二维码结果一并返回，调用方应以
        `status`、`auth_status` 和 `auth_payload` 标准字段为准。Passkey 结果不会把 Provider 原始 `code` 或 `info` 作为公共字段返回。
        Provider 返回空状态且没有二维码或 Passkey 载荷时，平台不会用该空结果覆盖当前 Session。已有 `authorized`、`failed`、`cancelled`、`expired`
        或 Passkey 状态按 当前快照返回；Provider 明确返回终态时会清除旧二维码和原始兼容载荷，不会回放 已失效的认证材料。没有可确认状态时返回 409 `provider_not_ready`。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/QRAuthCheckResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

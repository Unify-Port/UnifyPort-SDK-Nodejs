            $ref: "#/components/schemas/ConversationMember"
        next_cursor:
          type: string
        has_more:
          type: boolean
    ConversationIdRequest:
      type: object
      required:
        - conversation_id
      properties:
        conversation_id:
          type: string
    ConversationHistoryBefore:
      type: object
      required:
        - message_id
        - sent_at
        - direction
      description: 同一会话中同一条原生内容消息的位置；所有字段必须来自该消息，不接受 null。type=call 的合成通话记录即使三个字段完整也不能作为锚点；请求不包含 type 字段。
      properties:
        message_id:
          type: string
          minLength: 1
          pattern: \S
          not:
            pattern: ^call_record_[0-9a-f]{64}$
          description: 原生内容消息的 id；不接受合成通话记录 ID，去除首尾空白后仍为该记录格式时同样无效。不能使用顶层事件 id 或 HTTP request_id 代替。
        sent_at:
          type: string
          format: date-time
          description: 该消息的 RFC3339 发送时间，Unix 秒值必须大于 0；不能使用事件 occurred_at 或当前时间代替。
        direction:
          type: string
          enum:
            - inbound
            - outbound
          description: 该消息相对于当前账号的收发方向；inbound 为接收，outbound 为发送。
    ConversationHistoryRequest:
      type: object
      required:
        - conversation_id
        - before
      properties:
        conversation_id:
          type: string
          pattern: ^[0-9]+@lid$
          description: WhatsApp 标准私聊 LID；必须属于 before 指向的会话，不接受手机号或其他会话类型。
        before:
          $ref: "#/components/schemas/ConversationHistoryBefore"
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
          description: 请求数量，不保证实际返回相同数量；仅省略时默认 50，显式 null、0、非整数或超过 50 均返回 invalid_request。
    ConversationHistoryAccepted:
      type: object
      required:
        - status
        - conversation_id
        - limit
      properties:
        status:
          type: string
          enum:
            - accepted
          description: 仅确认请求已受理，不表示收到历史或完成补拉。
        conversation_id:
          type: string
          description: 本次请求的标准会话 ID。
        limit:
          type: integer
          minimum: 1
          maximum: 50
          description: 本次实际请求的数量上限。
    ConversationReadRequest:
      allOf:
        - $ref: "#/components/schemas/ConversationIdRequest"
        - type: object
          properties:
            up_to_message_id:
              type: string
              description: 按账号所属渠道校验，字段类型始终为字符串。 Telegram 必填：当前账号在该会话收到的单个消息 ID，例如 message.received 的 data.message.id，且
                data.message.direction=inbound。 去除首尾空白后必须只含 ASCII 十进制数字，数值范围为 1–2147483647；
                截止该消息（含自身及此前消息）标记已读。不能使用逗号列表、正负号、小数、指数、内部空白或非 ASCII 数字，不能省略或使用 0 表示整个会话。 WhatsApp 可选：一个消息
                ID，或属于同一发送者的多个消息 ID（英文逗号分隔）； 与 up_to_message_sender_id
                成对提供非空值。省略两者时标记整个会话已读；两者去除首尾空白后均为空时同样标记整个会话。
            up_to_message_sender_id:
              type: string
              description: WhatsApp 消息级已读的渠道侧发送者标识，与非空 up_to_message_id 成对提供；群聊应传 Webhook 事件中的 data.sender.id。多个消息 ID
                必须属于同一发送者。Telegram 不支持此参数，提供非空值时返回 invalid_request。

  /v1/accounts/{account_id}/contacts/add:
    post:
      tags:
        - Contacts
      summary: 添加联系人
      description: 在指定账号所属渠道中添加一个联系人。`phone_number` 和 `username` 至少提供一个； `whatsapp_options` 仅适用于 WhatsApp 账号。
        添加失败时，`numeric_code=30017` 表示 Provider 限流，调用方应延迟退避重试； `numeric_code=30018` 表示账号 App State 失步，调用方应等待
        Provider 恢复后再重试。 两种细分原因均保持接口原有 HTTP 状态与字符串 `code`。 仅 whatsapp 添加联系人明确未将目标号码识别为有效 WhatsApp 联系人时，返回 HTTP
        500、 `code=create_contact_failed` 和 `numeric_code=35009`；`message` 保留完整原始原因，不增加前缀， 原因缺失时为 `Target
        phone number was not recognized as an active WhatsApp contact`。 调用方应按数字码提示用户核对国家区号、号码及 WhatsApp
        注册状态，核对实际响应与页面错误提示后再请求， 不应持续自动重试；该错误不确认号码未注册或永久不可用。其他添加失败沿用原有分类。
      operationId: createContact
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreateRequest"
            example:
              phone_number: "8613800000000"
              username: alice_user
              whatsapp_options:
                first_name: Alice
                full_name: Alice Example
                sync_to_device_contacts: false
      responses:
        "200":
          description: 添加成功后的联系人信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Contact"
              example:
                request_id: 995f30b6308a67d6
                data:
                  id: 8613800000000@s.whatsapp.net
                  conversation_id: 123456789012345@lid
                  display_name: Alice Example
                  avatar_url: ""
                  provider_user_id: 8613800000000@s.whatsapp.net
                  extra:
                    phone: "8613800000000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 添加联系人失败；whatsapp 目标号码未被识别为有效联系人时，numeric_code=35009，保持 code=create_contact_failed，并保留完整原始原因。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                contactNotActive:
                  summary: 目标号码未被识别为有效 WhatsApp 联系人；message 以实际返回的原始原因为准，示例为无原因时的固定提示。
                  value:
                    request_id: req_example_contact_not_active
                    error:
                      code: create_contact_failed
                      numeric_code: "35009"
                      message: Target phone number was not recognized as an active WhatsApp contact
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

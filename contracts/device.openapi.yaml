                  webauthn_response: '{"id":"credential-id","response":{"clientDataJSON":"..."}}'
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/auth/passkey-confirm:
    post:
      tags:
        - Account Auth
      summary: 确认 Passkey 授权
      operationId: confirmAccountPasskey
      description: 确认当前账号授权流程中等待用户确认的 Passkey 挑战。当前仅支持使用 `qrcode` 授权模式的 WhatsApp 账号。
      parameters:

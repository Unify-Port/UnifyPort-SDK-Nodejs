        JSON body，不要求帖子属于当前账号。 TikTok 的 post_id 须为无前导零的正十进制整数字符串；不符合渠道格式时返回 400 provider_invalid_request。
        仅保证一级评论，不提供完整回复分页。空列表为 []，has_more=false 时省略 next_cursor。 读取失败保留既有 provider 错误分类；其他读取失败返回 502

  /v1/accounts/{account_id}/conversations/history/request:
    post:
      tags:
        - Conversations
      summary: 请求补拉会话历史消息
      description: 仅支持 provider=whatsapp 的私聊，不包含 whatsapp-protocol；使用同一会话中一条原生内容消息的完整 before 请求更早的历史。 account_id
        必须是单个非空路径段，不能包含空白或斜杠（包括编码斜杠）；入口账号参数校验失败返回 400 invalid_request。 HTTP 202 和 data.status=accepted
        仅表示补拉请求已受理，不同步返回消息，也不表示历史已经拉取完成。 先订阅 conversation.history，再发起请求；可用历史批次通过该事件异步返回，并携带
        data.history.source=on_demand。 顶层 request_id 仅用于本次 HTTP 请求排障，不是补拉任务
        ID，不能用于关联后续回调；一次请求可能对应多个、重复或晚到的批次，也可能没有回调。 继续补拉时，从已收到的原生内容消息中选择最早且 id、sent_at、direction 完整的消息构造
        before。 type=call 的合成通话记录不能作为锚点；即使三个字段完整，合成记录 ID 也不是原生消息 ID。before 不增加 type 字段，由调用方选择消息时排除通话记录。
        不提供下一页游标或完成状态；不能根据空批次、消息少于 limit 或等待超时判断历史已到底，HTTP 超时后也可能收到回调，不应自动重试。 群聊和频道返回 400
        unsupported_conversation_type；其他渠道返回 501 unsupported_by_provider。
      operationId: requestConversationHistory
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationHistoryRequest"
            example:
              conversation_id: 100000000000002@lid
              before:
                message_id: MSG_HISTORY_ANCHOR_001
                sent_at: 2026-09-28T03:00:00Z
                direction: inbound
              limit: 50
      responses:
        "202":
          description: 补拉请求已受理，等待可用历史批次；不代表已收到消息或补拉完成。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ConversationHistoryAccepted"
              example:
                request_id: req_history_example_001
                data:
                  status: accepted
                  conversation_id: 100000000000002@lid
                  limit: 50
        "400":
          description: 参数缺失或非法；invalid_request 表示请求字段或账号路径校验失败，provider_invalid_request 表示渠道参数无效（包括使用合成通话记录 ID
            作为锚点），unsupported_conversation_type 表示会话类型不支持。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 账号路径格式有效，但账号不存在或不属于当前工作空间，code 为 account_not_found，numeric_code 为 20020。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                request_id: req_history_account_missing
                error:
                  code: account_not_found
                  numeric_code: "20020"
                  message: Account not found
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 发生未分类的内部错误，code 为 request_conversation_history_failed，numeric_code 为 37016。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/conversations/read:
    post:
      tags:
        - Conversations
      summary: 标记会话已读
      operationId: markConversationRead
      description: 按账号所属渠道校验已读目标。Telegram 必须提供单个 up_to_message_id， 来自当前账号在该会话收到的消息，例如 message.received 的
        data.message.id，且 data.message.direction=inbound；不能使用发送响应的 data.message_id 或事件顶层 id。
        将当前账号在该会话中截至该消息（含自身及此前消息）的记录标为已读； 不支持省略消息 ID 标记整个会话，也不支持非空 up_to_message_sender_id。 WhatsApp
        的消息级已读须成对提供非空 up_to_message_id 和 up_to_message_sender_id； 省略两者，或两者去除首尾空白后均为空时，标记整个会话。成功返回
        data.ok=true；本次操作不查询对方已读状态，也不新增 Webhook 事件。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationReadRequest"
            examples:
              telegram:
                summary: Telegram 截至指定消息已读
                value:
                  conversation_id: "-1001234567890"
                  up_to_message_id: "12345"
              whatsappMessages:
                summary: WhatsApp 同一发送者的多条消息已读
                value:
                  conversation_id: 120363000000001@g.us
                  up_to_message_id: MSG_EXAMPLE_001,MSG_EXAMPLE_002
                  up_to_message_sender_id: 100000000000001@lid
              whatsappConversation:
                summary: WhatsApp 整个会话已读
                value:
                  conversation_id: 100000000000001@lid
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          description: 请求字段或当前渠道的已读目标无效时返回 invalid_request（10000）；渠道拒绝参数时返回 provider_invalid_request（30001）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

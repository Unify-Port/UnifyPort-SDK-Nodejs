        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/runtime/reconnect:
    post:
      tags:
        - Account Runtime
      summary: 重连账号运行态
      operationId: reconnectAccountRuntime
      description: TikTok 重连会应用最新 provider_data.enable_comment；可在 body 中临时传入 Boolean enable_comment 覆盖，false 显式关闭。
        字符串、数字或 null 返回 400 invalid_request。轮询默认关闭；关闭不撤回已排队事件。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/posts:
    get:
      tags:
        - Posts
      summary: 列出本账号帖子
      description: 仅支持 TikTok 当前登录账号；其他渠道返回 501 unsupported_by_provider。 非法字段、null、空白 ID、分页范围错误返回 400
        invalid_request（10000）。limit 默认 20，范围 1–50。 账号不存在或不属于当前工作空间返回 404 account_not_found（20020）。
        归属或分页核验未完成返回可重试失败，不能视为资源不存在。 has_more=true 时提供 next_cursor；末页 has_more=false 并省略 next_cursor。 读取失败保留
        provider_not_ready、provider_invalid_request、provider_unavailable 分类；其他读取失败返回 502
        list_posts_failed（39002）。
      operationId: listPosts
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
          description: 原样传回上一页的 next_cursor；首次请求省略。
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 列出本账号帖子结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PostListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 账号不存在或不属于当前工作空间时返回 account_not_found（20020）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/posts/info:
    post:
      tags:
        - Posts
      summary: 获取帖子详情
      description: 仅支持 TikTok；其他渠道返回 501 unsupported_by_provider。 可直接提交已知
        post_id，无需先查询本账号帖子列表。目标是否可访问由渠道结果决定，不保证其他账号的帖子可读取。 JSON body 必填非空字符串 post_id，不接受 null、未知字段或重复键；非法请求返回
        400 invalid_request（10000）。 TikTok 的 post_id 须为无前导零的正十进制整数字符串，按原值传递；不符合渠道格式时返回 400
        provider_invalid_request。 账号不在当前工作空间返回 404 account_not_found（20020）；可靠确认帖子不存在时返回 404
        post_not_found（39000）。 当前账号无法访问目标时返回 403 post_inaccessible（39005），不能据此判断具体是登录、权限还是资源归属原因，也不能视为不存在。
        只有可靠取得与请求帖子 ID 一致的资源后才返回标准 Post；上游异常返回失败，不返回部分详情。 现有可选字段仅在可靠取得时提供，不新增帖子媒体或统计计数。 读取失败保留
        provider_not_ready、provider_invalid_request、provider_unavailable 分类；其他详情读取失败返回 502
        get_post_failed（39006）。
      operationId: getPost
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInfoRequest"
            example:
              post_id: "7500000000000000101"
      responses:
        "200":
          description: 目标帖子详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 当前账号无法访问目标帖子（post_inaccessible，39005）；不代表帖子不存在，也不指明具体拒绝原因。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: 账号不在当前工作空间（account_not_found，20020）；可靠确认帖子不存在时返回 post_not_found（39000）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/posts/comments/list:
    post:

    CallEventSender:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: WhatsApp 对端标识；外呼事件中表示被呼叫方。
        display_name:
          type: string
          description: 可用时返回对端展示名称。
    CallEventCall:
      type: object
      required:
        - id
        - direction
        - media_type
        - state
      properties:
        id:
          type: string
          description: UnifyPort 本次通话 ID，同一通话生命周期内保持不变。
        direction:
          type: string
          enum:
            - inbound
            - outbound
        media_type:
          type: string
          enum:
            - voice
            - video
        state:
          type: string
          enum:
            - ringing
            - active
            - ended
    CallIncomingWebhookEvent:
      type: object
      description: 来电事件，携带短期浏览器接听链接；仅内测工作区订阅匹配时投递，`*`、空数组或省略订阅均可匹配，具体事件列表须包含 call.incoming。与 message.*
        通话记录独立。呼入暂未开放，内测资格不会自动开启呼入；投递及重试时重新核验资格。
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          description: 用于幂等处理的事件 ID。
        type:
          type: string
          enum:
            - call.incoming
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - sender
            - call
            - join_url
          properties:
            sender:
              $ref: "#/components/schemas/CallEventSender"
            call:
              allOf:
                - $ref: "#/components/schemas/CallEventCall"
                - type: object
                  properties:
                    direction:
                      const: inbound
                    state:
                      const: ringing
            join_url:
              type: string
              format: uri
              description: 短期、一次性的 HTTPS 浏览器接听链接。
    CallAnsweredWebhookEvent:
      type: object
      description: 仅内测工作区订阅匹配时投递，`*`、空数组或省略订阅均可匹配，具体事件列表须包含 call.answered；每次投递及重试重新核验资格，与 message.* 通话记录独立。呼入暂未开放。
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          description: 用于幂等处理的事件 ID。
        type:
          type: string
          enum:
            - call.answered
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - sender
            - call
          properties:
            sender:
              $ref: "#/components/schemas/CallEventSender"
            call:
              $ref: "#/components/schemas/CallEventCall"
    CallEndedWebhookEvent:
      type: object
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      description: 仅内测工作区订阅匹配时投递，`*`、空数组或省略订阅均可匹配，具体事件列表须包含 call.ended；每次投递及重试重新核验资格，与 message.*
        通话记录独立。呼入暂未开放。外呼在尚无对端标识时结束，省略 data.sender；来电结束仍必须提供 sender，提供时必须包含真实 id。
      properties:
        id:
          type: string
          description: 用于幂等处理的事件 ID。
        type:
          type: string
          enum:
            - call.ended
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - call
            - reason
            - duration_seconds
          allOf:
            - if:
                properties:
                  call:
                    properties:
                      direction:
                        const: inbound
              then:
                required:
                  - sender
          properties:
            sender:
              $ref: "#/components/schemas/CallEventSender"
            call:
              $ref: "#/components/schemas/CallEventCall"
            reason:
              type: string
              enum:
                - declined
                - caller_cancelled
                - local_hangup
                - remote_hangup
                - answer_failed
                - provider_disconnected
                - media_failed
                - expired
                - remote_busy
                - no_answer
                - dial_failed
            duration_seconds:
              type: integer
              minimum: 0
    MessageReferral:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 当前消息的可选来源信息；仅输出类型正确的已知字段，字符串必须非空，显式 false 保留，无可用字段时省略整个对象。所有字段均可省略，缺失不表示否定或清空。
      properties:
        source:
          type: string
          enum:
            - ad
          description: 仅确认广告来源时提供 ad，来源未知时省略。
        source_id:
          type: string
          minLength: 1
          pattern: \S
          description: 来源标识；作为不透明字符串保存，不转换成数字。
        source_url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?:[^/?#@\s]*@)?(?:\[[^/?#\s]+\]|[^/?#:@\s]+)(?::[0-9]*)?(?:[/?#]|$)
          description: 来源 URL，不承诺为广告主落地页；必须为带主机名的绝对 HTTP(S) URL，保留完整查询参数。
        title:
          type: string
          minLength: 1
          pattern: \S
        body:
          type: string
          minLength: 1
          pattern: \S
        media_type:
          type: string
          enum:
            - image
            - video
          description: 来源素材的已知媒体类型，未知时省略。
        thumbnail_url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?:[^/?#@\s]*@)?(?:\[[^/?#\s]+\]|[^/?#:@\s]+)(?::[0-9]*)?(?:[/?#]|$)
          description: 来源素材缩略图的绝对 HTTP(S) URL；缺失不影响其他归因字段。
        media_url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?:[^/?#@\s]*@)?(?:\[[^/?#\s]+\]|[^/?#:@\s]+)(?::[0-9]*)?(?:[/?#]|$)
          description: 来源素材的绝对 HTTP(S) URL，不等同于当前消息附件地址。
        provider_extensions:
          $ref: "#/components/schemas/MessageReferralProviderExtensions"
    MessageReferralProviderExtensions:
      type: object
      additionalProperties: false
      required:
        - whatsapp
      description: 可选的渠道扩展；仅 provider=whatsapp 时允许出现，无可用字段时省略。
      properties:
        whatsapp:
          $ref: "#/components/schemas/WhatsAppMessageReferralExtension"
    WhatsAppMessageReferralExtension:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 可选的 WhatsApp 广告上下文；各字段独立提供，无有效字段时省略整个扩展。显式 false 与字段缺失含义不同。
      properties:
        ctwa_clid:
          type: string
          minLength: 1
          pattern: \S
          description: WhatsApp 提供的广告点击标识；作为不透明字符串保存，未提供时省略该字段。
        greeting_message_body:
          type: string
          minLength: 1
          pattern: \S
          description: 广告上下文提供的欢迎语正文，原样保存；不代表一条具有独立消息身份的发送记录。
        automated_greeting_message_shown:
          type: boolean
          description: 上游明确提供的欢迎语展示标记；保留 false，缺失时不推断展示状态。
        automated_greeting_message_cta_type:
          type: string
          minLength: 1
          pattern: \S
          description: 上游提供的欢迎语交互入口类型；按不透明字符串保存，不限定枚举。
        source_app:
          type: string
          minLength: 1
          pattern: \S
          description: 上游提供的来源应用标识；仅在有原值时提供，不从其他来源信息推断。
        click_to_whatsapp_call:
          type: boolean
          description: 上游提供的广告通话入口标记；保留 false，该标记不证明已发生通话。
        contains_auto_reply:
          type: boolean
          description: 上游提供的自动回复标记；保留 false，不用于推断或覆盖欢迎语展示状态。
        contains_ctwa_flows_auto_reply:
          type: boolean
          description: 上游提供的 CTWA Flows 自动回复标记；保留 false，不代表提供 Flows 内容或执行能力。
    MessageWithOptionalReferral:
      type: object
      additionalProperties: true
      description: 广告归因以可选字段补充原消息，不改变消息正文、附件及已有类型。
      properties:
        id:
          type: string
          description: 可选消息 ID；未提供时不能用顶层事件 ID、来源标识或点击标识替代。
        referral:
          $ref: "#/components/schemas/MessageReferral"
    MessageReferralWebhookEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - message.received
            - message.updated
            - conversation.history
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          properties:
            message:
              $ref: "#/components/schemas/MessageWithOptionalReferral"
            messages:
              type: array
              items:
                $ref: "#/components/schemas/MessageWithOptionalReferral"
      allOf:
        - if:
            properties:
              provider:
                not:
                  const: whatsapp
          then:
            properties:
              data:
                properties:
                  message:
                    properties:
                      referral:
                        properties:
                          provider_extensions: false
                  messages:
                    items:
                      properties:
                        referral:
                          properties:
                            provider_extensions: false
    MessageReferralReceivedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.received
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  type: object
                  additionalProperties: true
                  required:
                    - referral
                  properties:
                    referral:
                      $ref: "#/components/schemas/MessageReferral"
    MessageReferralUpdatedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.updated
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  type: object
                  additionalProperties: true
                  required:
                    - id
                    - referral
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: 被编辑消息的 ID，与该消息原记录保持一致。
                    referral:
                      $ref: "#/components/schemas/MessageReferral"
    MessageReferralHistoryWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - conversation.history
            data:
              type: object
              additionalProperties: true
              required:
                - messages
              properties:
                messages:
                  contains:
                    type: object
                    additionalProperties: true
                    required:
                      - referral
                    properties:
                      referral:
                        $ref: "#/components/schemas/MessageReferral"
    ConversationHistorySource:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          type: string
          enum:
            - on_demand
          description: 本次批次来自按需补拉；不标识具体请求或补拉完成状态。
    ConversationHistoryMessage:
      type: object
      additionalProperties: true
      description: 标准历史消息，沿用现有正文、附件和可选归因字段；仅具有原生消息 ID 且 id、sent_at、direction 完整的内容消息可用于继续补拉，合成通话记录不可用。
      properties:
        id:
          type: string
        type:
          type: string
        text:
          type: string
        sent_at:
          type: string
          format: date-time
        direction:
          type: string
          enum:
            - inbound
            - outbound
        referral:
          $ref: "#/components/schemas/MessageReferral"
    ConversationHistoryWebhookEvent:
      type: object
      additionalProperties: true
      description: 同一会话的一批历史可通过多个 conversation.history 事件提供；按 provider、account_id、data.conversation.id 和消息 id
        合并全部事件，不以事件个数或单个事件内的消息数量判断完整历史已恢复。每条消息保持完整，不截短字段；按需事件均保留 data.history.source=on_demand，不产生
        account.history.synced。
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          description: 事件去重标识，不是补拉请求 ID。
        type:
          type: string
          enum:
            - conversation.history
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
          description: 事件时间，不能替代每条消息的 sent_at。
        data:
          type: object
          additionalProperties: true
          required:
            - conversation
            - messages
          properties:
            conversation:
              type: object
              required:
                - id
                - type
              properties:
                id:
                  type: string
                type:
                  $ref: "#/components/schemas/ConversationType"
            messages:
              type: array
              description: 当前事件提供的可用历史消息，可为空数组；同一会话可能还有其他历史事件。空数组或数量不足不代表全部历史已完成。
              items:
                $ref: "#/components/schemas/ConversationHistoryMessage"
            history:
              $ref: "#/components/schemas/ConversationHistorySource"
              description: 仅按需补拉批次提供；自动历史同步继续沿用原有结构。
    MessageCommerceHTTPURL:
      type: string
      format: uri
      pattern: ^[Hh][Tt][Tt][Pp][Ss]?://(?:[^/?#@\s]*@)?(?:\[[^/?#\s]+\]|[^/?#:@\s]+)(?::[0-9]*)?(?:[/?#]|$)
      description: 带主机名的绝对 HTTP(S) URI，保留查询参数；格式有效不保证资源可访问或永久有效。
    MessageCommerceMoney:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 金额与币种按各自是否提供分别输出；缺失不补零或默认币种，两者均未知时省略整个对象。
      properties:
        amount:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)?$
          not:
            pattern: \s
          description: 币种主单位的非负精确十进制字符串；保留零值，不使用指数、正负号或空白，不限制为固定小数位。
        currency:
          type: string
          minLength: 1
          pattern: \S
          description: 原始币种标识，按非空不透明字符串保存；不默认 USD，也不强制三字符编码。
    MessageProduct:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 当前消息中的商品卡片，至少包含一个已知有效字段；缺图片或价格不影响其他商品信息。
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: 可选商品标识，与消息 ID 和顶层事件 ID 含义不同，不能用于替代消息关联。
        title:
          type: string
          minLength: 1
          pattern: \S
        description:
          type: string
          minLength: 1
          pattern: \S
        url:
          $ref: "#/components/schemas/MessageCommerceHTTPURL"
        image_url:
          $ref: "#/components/schemas/MessageCommerceHTTPURL"
        price:
          $ref: "#/components/schemas/MessageCommerceMoney"
    MessageOrder:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 当前消息中的订单汇总；至少包含一个已知有效字段，不包含商品明细，也不表示支付结果或完整订单生命周期。
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: 可选订单标识，与消息 ID 和顶层事件 ID 含义不同，不能用于替代消息关联。
        title:
          type: string
          minLength: 1
          pattern: \S
        item_count:
          type: integer
          minimum: 0
          description: 已提供的商品数量；零值保留，缺失不补零，也不根据数量构造明细。
        status:
          type: string
          enum:
            - inquiry
            - accepted
            - declined
          description: inquiry 为询单，accepted 为已接受，declined 为已拒绝；未知时省略，accepted 不表示付款成功。
        thumbnail_url:
          $ref: "#/components/schemas/MessageCommerceHTTPURL"
        total:
          $ref: "#/components/schemas/MessageCommerceMoney"
    MessageCommerce:
      allOf:
        - $ref: "#/components/schemas/MessageWithOptionalReferral"
        - type: object
          additionalProperties: true
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - product
                - order
            product:
              $ref: "#/components/schemas/MessageProduct"
            order:
              $ref: "#/components/schemas/MessageOrder"
          oneOf:
            - required:
                - product
              properties:
                type:
                  const: product
                product:
                  $ref: "#/components/schemas/MessageProduct"
                order: false
            - required:
                - order
              properties:
                type:
                  const: order
                product: false
                order:
                  $ref: "#/components/schemas/MessageOrder"
    MessageWithOptionalCommerce:
      oneOf:
        - $ref: "#/components/schemas/MessageCommerce"
        - allOf:
            - $ref: "#/components/schemas/MessageWithOptionalReferral"
            - type: object
              additionalProperties: true
              properties:
                type:
                  not:
                    enum:
                      - product
                      - order
                product: false
                order: false
    MessageCommerceWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            data:
              type: object
              additionalProperties: true
              properties:
                message:
                  $ref: "#/components/schemas/MessageWithOptionalCommerce"
                messages:
                  type: array
                  items:
                    $ref: "#/components/schemas/MessageWithOptionalCommerce"
    MessageCommerceReceivedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageCommerceWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.received
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  $ref: "#/components/schemas/MessageCommerce"
    MessageCommerceUpdatedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageCommerceWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.updated
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  allOf:
                    - $ref: "#/components/schemas/MessageCommerce"
                    - type: object
                      additionalProperties: true
                      required:
                        - id
                      properties:
                        id:
                          type: string
                          minLength: 1
    MessageCommerceHistoryWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageCommerceWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - conversation.history
            data:
              type: object
              additionalProperties: true
              required:
                - messages
              properties:
                messages:
                  type: array
                  contains:
                    $ref: "#/components/schemas/MessageCommerce"
    MessageInteractiveButton:
      type: object
      additionalProperties: false
      required:
        - type

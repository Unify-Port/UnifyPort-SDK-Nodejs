  /v1/messages:
    post:
      tags:
        - Messages
      summary: 发送消息
      operationId: sendMessage
      description: "`message.type=sticker` 用于发送贴纸，当前仅 WhatsApp user/group 支持，不包含 whatsapp-protocol。
        url/file_url/file_key 恰好提供一个非空来源；本期 WhatsApp 只支持 HTTP(S) url/file_url，file_key、非空 mentions 或不支持的目标返回
        501 unsupported_by_provider。 API 按原字节提交 WebP，不设置静态性、像素尺寸或渠道业务大小限制；静态、动画及具体素材兼容性由渠道判定。 本接口仅检查基本 WebP
        容器完整性，不解码或转码。下载与暂存的硬资源上限为 10 MiB（10485760 字节），下载最多 15 秒、3 次跳转。 该上限是本接口的资源边界，不代表渠道接受该大小以内的所有素材。accepted
        仅表示受理，不保证送达、素材可解码或动画播放效果。 sticker 不允许 text/caption/contacts/poll/link_preview 等其他内容字段，即使为 null 或空值也返回
        400 invalid_request。 sticker 的 provider_data 只能省略或为空对象；非对象为 400 invalid_request，非空对象为 400
        provider_invalid_request。 支持既有 reply_to.reply_token；无效或无法解封的 token 返回 400 invalid_reply_token。 基本 WebP
        容器不完整、不可接受的素材来源地址或超过硬资源上限时，发送前返回 400 provider_invalid_request、numeric_code=36007，表示贴纸尚未发送。 message
        提供具体素材校验原因，原因缺失时为 Invalid sticker media；调用方按数字码判断，修正素材或来源地址后再发送。 非空
        provider_data、公共结构错误和实际渠道参数拒绝沿用各自分类，实际渠道参数拒绝仍为 400 provider_invalid_request、numeric_code=30001。
        贴纸实际发送失败保留既有 HTTP、code、numeric_code 和专属分类提示，提供可用的具体失败原因；上游未提供时沿用默认提示。其他消息类型保持既有行为。 素材获取的 HTTP
        故障、超时、存储或其他准备失败返回 500 send_message_failed、numeric_code=36001，message 提供具体准备失败原因，缺失时沿用默认提示；不使用 36007。
        sticker 超时或结果不明时不会自动重发；request_id/client_request_id 仅用于追踪，不提供发送幂等保证。 `message.type=poll` 用于创建投票；当前仅
        WhatsApp 的 user/group 目标支持，不包含 `whatsapp-protocol`。 投票必须提供非空白题目、至少两个非空白标题的选项及整数 max_selections（1
        到选项数）；原文保持不变。 本项目 WhatsApp 发送策略限制题目最多 255 个 Unicode 字符、选项最多 12 个、每项标题最多 100 个 Unicode
        字符，并拒绝完全相同的原文标题；这些不是其他渠道的公共限制或平台硬性限制声明。 WhatsApp 投票不支持 reply_to 或非空 mentions；不支持的渠道、目标或组合返回 HTTP 501
        unsupported_by_provider。 投票公共结构、null、未知字段或混合载荷错误返回 HTTP 400 invalid_request；违反 WhatsApp 字段策略或提供
        provider_data.context_info/extra 返回 HTTP 400 provider_invalid_request。 创建成功沿用发送响应；引用上下文完整时可选返回
        data.reply_token，普通文字消息可通过 reply_to.reply_token 引用该投票，无需等待创建回调。 缺少可引用上下文时省略 token，accepted 状态不因此改变；不能用
        message_id 或 provider_ref 代替 token。新投票自身仍不支持 reply_to，不提供投票统计或代替账号投票。
        超时或响应不完整时发送结果可能未知，先核对实际消息与回调再决定重试。 `message.type=link_preview` 用于发送自定义链接预览；当前仅 WhatsApp 的 user/group
        目标支持，不包含 `whatsapp-protocol`。 公共结构要求非空正文和 HTTP(S) 目标链接；WhatsApp 还要求非空标题、图片 URL，以及目标链接原文出现在正文中。 本项目
        WhatsApp 发送策略限制标题最多 255 个 Unicode 字符、摘要最多 1024 个 Unicode 字符；这不是其他渠道的公共限制或平台硬性限制声明。 WhatsApp 链接预览不支持
        `reply_to` 或非空 `mentions`，不支持的渠道、目标或组合返回 HTTP 501 `unsupported_by_provider`。 公共字段格式错误返回 HTTP 400
        `invalid_request`；违反上述 WhatsApp 字段策略或使用覆盖卡片数据的渠道扩展返回 HTTP 400 `provider_invalid_request`。
        本接口不抓取目标网页生成预览，调用方提供卡片内容。HTTP 200 / accepted 不表示已送达，也不保证一定收到自同步回调。 WhatsApp 消息发送被平台明确限制时，返回 HTTP
        502、`code=provider_unavailable` 和 `numeric_code=30019`。 调用方应按该数字码停止对此类失败的自动重试，确认平台限制解除后再发送。 `whatsapp`
        群消息发送被明确拒绝为需要管理员权限时，返回 HTTP 502、`code=provider_unavailable` 和 `numeric_code=34012`，`message` 为 `Group
        administrator privileges are required to send messages to this group`。
        调用方应停止自动重试，核实群发言权限和当前账号角色，由群管理员调整权限后再发送。 此错误不表示该群一定是社群公告群，也不确认群设置或账号角色的具体状态；不适用于 `whatsapp-protocol`。
        Device API 在 `whatsapp` 发送操作中识别到账号受限时，返回 HTTP 502、`code=provider_unavailable` 和
        `numeric_code=20102`，与该渠道账号受限 Webhook 的数字码一致。调用方应停止该账号的自动发送和重试， 引导用户在官方 WhatsApp
        客户端检查并处理限制，恢复正常后再按需重新授权。 此分类不会自动修改账号状态或产生额外回调，不能仅因运行状态为 `running` 恢复发送。 Device API 识别到
        `whatsapp-protocol` 账号当前登录受限时，返回 HTTP 502、`code=provider_unavailable` 和
        `numeric_code=30020`。调用方必须停止自动重试，引导用户前往官方 WhatsApp 客户端检查，
        处理完成并重新授权后再恢复发送。上述错误都不表示永久封号，也不能据此认定账号已确认封禁或存在固定恢复期限； 其他发送失败沿用原有错误分类。 Device API 识别到 WhatsApp
        账号连接未建立时，返回 HTTP 502、`code=provider_unavailable` 和 `numeric_code=30021`，`message`
        保留原始连接错误；此错误不表示已登出或授权失效。 调用方应暂停发送，调用 `POST /v1/accounts/{account_id}/runtime/refresh`，按最新状态恢复连接， 确认
        `runtime_status=running` 后再发送。失败请求不会自动重发或重连。 `numeric_code=30010` 的 `message` 在有原因时为 `Provider
        operation failed: <原始错误原因>`， 没有原因时为 `Provider operation failed`；调用方应按数字码判断，不依赖可变化的文案。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              poll:
                summary: WhatsApp 单选投票
                value:
                  account_id: acc_example
                  to:
                    id: 120000000000001@g.us
                    type: group
                  message:
                    type: poll
                    poll:
                      question: Which date works?
                      options:
                        - title: Monday
                        - title: Tuesday
                      max_selections: 1
              linkPreview:
                summary: WhatsApp 链接预览
                value:
                  account_id: acc_example
                  to:
                    id: 100000000000002@lid
                    type: user
                  message:
                    type: link_preview
                    text: See https://example.com/product
                    link_preview:
                      url: https://example.com/product
                      title: Example product
                      description: Product introduction
                      image_url: https://cdn.example.com/product-preview.jpg
              text:
                value:
                  account_id: acc_123
                  to:
                    id: target_123
                    type: user
                  message:
                    type: text
                    text: hello
              audio:
                summary: 发送 WhatsApp 音频消息
                value:
                  account_id: acc_123
                  to:
                    id: target_123
                    type: user
                  message:
                    type: audio
                    url: https://cdn.example.com/audio/voice-message.ogg
                  provider_data:
                    seconds: 12
              video:
                summary: 发送 WhatsApp 视频消息
                value:
                  account_id: acc_123
                  to:
                    id: target_123
                    type: user
                  message:
                    type: video
                    url: https://cdn.example.com/video/demo.mp4
                  provider_data:
                    seconds: 12
              contact:
                value:
                  account_id: acc_123
                  to:
                    id: 120363413405165529@g.us
                    type: group
                  message:
                    type: contact
                    contacts:
                      - name: Example
                        phones:
                          - number: "+8613800000000"
                            type: CELL
      responses:
        "200":
          description: 消息发送请求已被接收或完成。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/SendMessageResult"
              examples:
                linkPreviewAccepted:
                  summary: 链接预览请求已接受，不代表送达或自同步回调已发生
                  value:
                    request_id: req_preview_example
                    data:
                      message_id: MSG_PREVIEW_EXAMPLE
                      account_id: acc_example
                      status: accepted
                      provider_ref: MSG_PREVIEW_EXAMPLE
        "400":
          description: 请求体或参数非法；贴纸素材校验失败使用 provider_invalid_request 和 numeric_code=36007，message 提供具体原因，贴纸尚未发送。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidRequest:
                  summary: 公共请求结构或参数非法
                  value:
                    request_id: req_message_invalid_example
                    error:
                      code: invalid_request
                      numeric_code: "10000"
                      message: Invalid message request body
                invalidStickerMedia:
                  summary: 贴纸素材不符合要求，尚未发送
                  value:
                    request_id: req_sticker_invalid_example
                    error:
                      code: provider_invalid_request
                      numeric_code: "36007"
                      message: "invalid sticker media: invalid WebP container length"
                stickerProviderRejected:
                  summary: 渠道拒绝贴纸素材，提供具体失败原因
                  value:
                    request_id: req_sticker_rejected_example
                    error:
                      code: provider_invalid_request
                      numeric_code: "30001"
                      message: "sticker upload failed: media is unsupported"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          description: 发送消息时发生内部错误；贴纸素材下载、存储或其他准备失败保留 send_message_failed 和 numeric_code=36001，message 提供具体原因，缺失时沿用默认提示。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                stickerPreparationFailed:
                  summary: 素材获取失败，贴纸尚未发送
                  value:
                    request_id: req_sticker_prepare_failed_example
                    error:
                      code: send_message_failed
                      numeric_code: "36001"
                      message: "download sticker: media download returned HTTP 503"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          description: 渠道发送失败或暂不可用；numeric_code=20102 表示 whatsapp 账号受限，30020 表示 whatsapp-protocol 账号登录受限，30019
            表示平台限制发送，34012 表示 whatsapp 群消息发送需要管理员权限，均不应自动重试；34012 应先核实群权限和账号角色，由管理员调整后再发送；30021
            表示连接未建立，应先刷新账号状态；30010 附带可用的原始错误原因。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                messageRestricted:
                  summary: 平台限制发送消息
                  value:
                    request_id: req_example_message_restricted
                    error:
                      code: provider_unavailable
                      numeric_code: "30019"
                      message: Message sending is restricted by the platform
                groupAdminRequired:
                  summary: whatsapp 群消息发送需要管理员权限
                  value:
                    request_id: req_example_group_admin_required
                    error:
                      code: provider_unavailable
                      numeric_code: "34012"
                      message: Group administrator privileges are required to send messages to this group
                accountRestricted:
                  summary: whatsapp-protocol 账号当前登录受限
                  value:
                    request_id: req_example_account_restricted
                    error:
                      code: provider_unavailable
                      numeric_code: "30020"
                      message: Account login is restricted. Check the official WhatsApp app for details.
                whatsappAccountRestricted:
                  summary: whatsapp 发送时识别到账号受限
                  value:
                    request_id: req_example_whatsapp_account_restricted
                    error:
                      code: provider_unavailable
                      numeric_code: "20102"
                      message: Account login is restricted. Check the official WhatsApp app for details.
                operationFailed:
                  summary: 其他渠道业务发送失败
                  value:
                    request_id: req_example_message_failed
                    error:
                      code: provider_unavailable
                      numeric_code: "30010"
                      message: "Provider operation failed: Example operation could not be completed"
                connectionDisconnected:
                  summary: 账号连接未建立
                  value:
                    request_id: req_example_connection_disconnected
                    error:
                      code: provider_unavailable
                      numeric_code: "30021"
                      message: "example operation: websocket not connected"
                unavailable:
                  summary: 渠道服务暂不可用
                  value:
                    request_id: req_example_provider_unavailable
                    error:
                      code: provider_unavailable
                      numeric_code: "30002"
                      message: Provider service unavailable

  groupSettingsUpdated:
    post:
      summary: 群发言权限和邀请链接变化
      description: 复用 group.updated。公告模式保留明确 true/false，邀请链接变更只通知缓存失效；无可靠 changed_at 或状态冲突时回查详情，邀请变化始终查询当前链接。
      operationId: receiveGroupSettingsUpdatedWebhookEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSettingsUpdatedWebhookEvent"
      responses:
        2XX:
          description: Accepted.
  contactUpdated:
    post:
      summary: 联系人通讯录名称更新事件
      description: 适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 可精确订阅 `contact.updated`；省略订阅、空数组或 `*` 也会接收该新增事件。
        仅修改 `data.contact.address_book` 中出现的保存名字段；空字符串表示清空，缺省保持原值，null 非法，不覆盖对方昵称或账号本人资料。 `changed_fields`
        与实际提供的名称字段精确对应，不证明服务端已比对旧值。 `contact.id` 可关联联系人列表中同 ID 的资源，不能据此推算会话；可靠 `conversation_id`
        缺失时仍可更新通讯录记录。WhatsApp 详情查询使用已确认的 conversation_id（LID），不能直接使用 PN 资源 ID。 WhatsApp 详情在已有 LID 与 PN
        映射时可能返回不同的 PN 资源 ID；成功回查也不保证详情 id 与事件 contact.id 相同。保留原事件资源键，不用详情返回的 id 自动替换它或合并不同 PN/LID 记录。
        `full_sync` 只表示收到的同步快照，不承诺完整通讯录、每次同步必有事件或同步完成通知。 按事件 ID 幂等；以可靠 changed_at
        防止旧快照覆盖新名称。未知或同时间冲突不按接收顺序认定最新名称，occurred_at 不能代替 changed_at。
      operationId: receiveContactUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdatedWebhookEvent"
            examples:
              renamed:
                value:
                  id: evt_example_127019
                  type: contact.updated
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-20T03:00:00Z
                  data:
                    contact:
                      id: 15550000002@s.whatsapp.net
                      conversation_id: 100000000000002@lid
                      address_book:
                        full_name: Example customer
                        first_name: Example
                    event:
                      kind: contact_updated
                      source: address_book
                      changed_fields:
                        - address_book.full_name
                        - address_book.first_name
                      changed_at: 2026-09-20T03:00:00Z
              clearedWithoutConversation:
                value:
                  id: evt_example_127947
                  type: contact.updated
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-20T03:05:00Z
                  data:
                    contact:
                      id: 15550000002@s.whatsapp.net
                      address_book:
                        full_name: ""
                    event:
                      kind: contact_updated
                      source: address_book
                      changed_fields:
                        - address_book.full_name
                      changed_at: 2026-09-20T03:05:00Z
              fullSyncWithoutChangedAt:
                value:
                  id: evt_example_128706
                  type: contact.updated
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-20T03:10:00Z
                  data:
                    contact:
                      id: 100000000000002@lid
                      conversation_id: 100000000000002@lid
                      address_book:
                        first_name: Example
                    event:
                      kind: contact_updated
                      source: full_sync
                      changed_fields:
                        - address_book.first_name
      responses:
        "200":
          description: 已接收事件。
  conversationDisappearingMessagesUpdated:
    post:
      summary: 会话限时消息设置更新事件
      description: 适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用已有
        `conversation.updated`；`data.event.change_type=disappearing_messages`，不新增订阅名称或设置写接口。
        `disappearing_messages` 是本次完整设置快照，整体替换该对象；会话其他资料不受影响。 开启时 `enabled=true` 且 `duration_seconds`
        为正数；关闭时明确提供 `enabled=false` 和 `duration_seconds=0`，缺失不表示关闭。 操作者与可靠 `changed_at` 未知时省略；`occurred_at`
        不保证是可靠操作时间，不可代替它判断新旧。 按事件 ID 幂等，同值快照也可能来自不同事件。乱序使用可靠 changed_at；未知或同时间冲突不能按回调接收顺序推断最新设置。
        同次操作可能另有群变化通知，应分别处理；历史消息不重放设置更新，也不保证提供当前设置快照。 设置变化不删除已有消息或业务系统副本，不提供逐消息到期时间、自动删除通知或定时器。
      operationId: receiveConversationDisappearingMessagesUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationDisappearingMessagesUpdatedWebhookEvent"
            examples:
              enabled:
                value:
                  id: evt_example_130476
                  type: conversation.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:00:00.123Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    disappearing_messages:
                      enabled: true
                      duration_seconds: 86400
                    actor:
                      id: 100000000000003@lid
                      type: user
                      name: Example contact
                    event:
                      kind: conversation_updated
                      change_type: disappearing_messages
                      changed_at: 2026-09-21T03:00:00.123Z
              durationChanged:
                value:
                  id: evt_example_131405
                  type: conversation.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:05:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    disappearing_messages:
                      enabled: true
                      duration_seconds: 604800
                    actor:
                      id: 100000000000003@lid
                      type: user
                      name: Example contact
                    event:
                      kind: conversation_updated
                      change_type: disappearing_messages
                      changed_at: 2026-09-21T03:05:00Z
              disabled:
                value:
                  id: evt_example_132320
                  type: conversation.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:10:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    disappearing_messages:
                      enabled: false
                      duration_seconds: 0
                    actor:
                      id: 100000000000003@lid
                      type: user
                      name: Example contact
                    event:
                      kind: conversation_updated
                      change_type: disappearing_messages
                      changed_at: 2026-09-21T03:10:00Z
              groupWithoutKnownActorOrTime:
                value:
                  id: evt_example_133252
                  type: conversation.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:15:00Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    disappearing_messages:
                      enabled: true
                      duration_seconds: 86400
                    event:
                      kind: conversation_updated
                      change_type: disappearing_messages
      responses:
        2XX:
          description: 业务方已接收并接受处理该事件，重复投递也应幂等接受。
  messagePinUpdated:
    post:
      summary: 单条消息置顶状态更新事件
      description: 适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用 `message.updated`，`data.message.id` 是被操作的原消息
        ID，`data.event.change_type=message_pin`。 `message.pin`
        是本次置顶状态快照：每次整体替换该对象，缺失有效期也清除旧有效期；消息其他字段仍按稀疏更新处理。 `pinned=false` 明确取消置顶，不提供时长或有效期。`duration_seconds=0`
        不代表永久置顶。 `expires_at` 仅在提供可靠 `changed_at` 和正时长时存在；不能用收到回调的时间重新计算有效期。 `actor` 是操作者，`sender`
        仅在原消息作者可靠时提供，两者未知时省略；不提供原消息类型、方向、正文或发送时间。 原消息尚未保存也可收到更新，按目标消息 ID 暂存。到期不保证收到新的取消事件；历史消息不提供置顶状态快照。
        本事件与会话置顶分开；既有 `POST /v1/messages/pin` 的路径、支持范围及响应不变，调用成功不保证产生本回调。
      operationId: receiveMessagePinUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagePinUpdatedWebhookEvent"
            examples:
              pinned:
                value:
                  id: evt_example_134940
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:00:00.123Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    message:
                      id: MSG_PIN_TARGET
                      pin:
                        pinned: true
                        duration_seconds: 86400
                        expires_at: 2026-09-22T03:00:00.123Z
                    actor:
                      id: 100000000000002@lid
                      type: user
                    sender:
                      id: 100000000000003@lid
                      type: user
                    event:
                      kind: message_updated
                      change_type: message_pin
                      changed_at: 2026-09-21T03:00:00.123Z
              unpinned:
                value:
                  id: evt_example_136025
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:05:00Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    message:
                      id: MSG_PIN_TARGET
                      pin:
                        pinned: false
                    actor:
                      id: 100000000000002@lid
                      type: user
                    event:
                      kind: message_updated
                      change_type: message_pin
                      changed_at: 2026-09-21T03:05:00Z
              pinnedWithoutKnownTime:
                value:
                  id: evt_example_136901
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-21T03:10:00Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    message:
                      id: MSG_PIN_TARGET
                      pin:
                        pinned: true
                        duration_seconds: 0
                    event:
                      kind: message_updated
                      change_type: message_pin
      responses:
        2XX:
          description: 业务方已接收并接受处理该事件，重复投递也应幂等接受。
  messagePollReceived:
    post:
      tags:
        - Webhooks
      summary: 投票创建消息
      description: 沿用 message.received 订阅。当前仅 WhatsApp 支持投票创建。自同步可为 outbound；投票内容不包含累计票数、媒体正文或 reply_token。选项 ID
        为不透明值，调用方使用回调值。
      operationId: receiveMessagePollReceivedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagePollReceivedWebhookEvent"
            examples:
              pollCreated:
                value:
                  id: evt_example_138228
                  type: message.received
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-22T03:00:00.123Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    sender:
                      id: 100000000000001@lid
                      type: user
                    message:
                      id: POLL_EXAMPLE
                      type: poll
                      poll:
                        question: Which date works?
                        options:

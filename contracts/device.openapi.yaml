                summary: 发布一级评论
                value:
                  post_id: "7500000000000000101"
                  text: Example
              reply:
                summary: 回复指定一级评论
                value:
                  post_id: "7500000000000000101"
                  comment_id: "7500000000000000201"
                  text: Example
      responses:
        "200":
          description: 发布一级评论或回复一级评论的接受结果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/PostCommentReplyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 账号不存在或不属于当前工作空间时返回 account_not_found（20020）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

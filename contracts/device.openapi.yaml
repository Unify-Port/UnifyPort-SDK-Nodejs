                        - display_name
                        - push_name
                        - business_name
              whatsappAvatarChange:
                value:
                  id: evt_profile_avatar_a21e7d9c
                  type: account.profile.updated
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-03T02:00:00Z
                  data:
                    account:
                      provider_account_ref: provider_account_example
                    profile:
                      display_name: Example Account
                      push_name: Example Account
                      avatar_url: https://assets.example.com/accounts/avatar-new.jpg
                    event:
                      kind: account_profile_updated
                      source: avatar_change
                      changed_fields:
                        - avatar_url
      responses:
        2XX:
          description: 业务方已接收事件。
  accountStarted:
    post:
      summary: 账号运行态上线事件
      description: 账号与 Provider 建立运行连接后投递。`runtime_status` 只使用平台标准值 `running`；Provider 原始值
        `ready`、`online`、`connected` 等不会对外透传。
      operationId: receiveAccountStartedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStartedWebhookEvent"
            examples:
              whatsappStarted:
                value:
                  id: evt_acc_2b3c4d5e6f
                  type: account.started
                  provider: whatsapp
                  account_id: acc_8c21d0
                  occurred_at: 2026-06-08T13:21:00Z
                  data:
                    runtime_status: running
                    event:
                      kind: account_started
                      runtime_status: running
      responses:
        2XX:
          description: 业务方已接收事件。
  callIncoming:
    post:
      summary: 呼入通话事件
      description: 呼入暂未开放，内测资格不会自动开启呼入。该事件仅向具备内测资格且订阅匹配的工作区投递；内测工作区的 `*`、空数组或省略订阅均包含通话事件，具体事件列表则按列表匹配。该事件仅表示
        inbound。`join_url` 是短期、一次性的浏览器接听链接，不应持久化或写入日志。
      operationId: receiveCallIncomingWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallIncomingWebhookEvent"
      responses:
        2XX:
          description: 业务方已接收事件。
  callAnswered:
    post:
      summary: 通话已接听事件
      operationId: receiveCallAnsweredWebhook
      description: 仅向具备内测资格且订阅匹配的工作区投递；内测工作区的
        `*`、空数组或省略订阅均包含通话事件，具体事件列表则按列表匹配。投递及重试时重新核验资格。呼入或外呼的语音/视频通话已接通，data.call.state 为 active；不携带
        join_url。呼入暂未开放；message.* 通话记录不受此门禁影响。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallAnsweredWebhookEvent"
      responses:
        2XX:
          description: 业务方已接收事件。
  callEnded:
    post:
      summary: 通话已结束事件
      operationId: receiveCallEndedWebhook
      description: 仅向具备内测资格且订阅匹配的工作区投递；内测工作区的
        `*`、空数组或省略订阅均包含通话事件，具体事件列表则按列表匹配。投递及重试时重新核验资格。呼入或外呼的语音/视频通话已结束，data.call.state 为 ended；原因保持在
        data.reason，不携带 join_url。呼入暂未开放；message.* 通话记录不受此门禁影响。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEndedWebhookEvent"
      responses:
        2XX:
          description: 业务方已接收事件。
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 当前 workspace 的 API Key。
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
      description: device-api 签发的账号 public_id，例如 `acc_xxx`。
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
      description: API Key public_id，例如 `ak_xxx`。
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
      description: Webhook endpoint public_id，例如 `we_xxx`。
    WebhookAccountIdQuery:
      name: account_id
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        pattern: \S
      description: 可选的公开账号 ID，例如 `acc_example`。不可为空、仅含空白或重复出现。 参数名必须精确使用 account_id；大小写变体返回 400
        invalid_request，不按省略处理。 列表接口用它筛选账号独立配置；详情、停用、删除接口只校验端点已有账号归属。
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderInputName"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Provider 不透明游标，应原样回传上一次响应的 `next_cursor`。 伪造、失效或跨查询复用的 cursor 可能被 Provider 忽略、重置为第一页，或返回 Provider
        错误；客户端不得依赖统一的 400 行为。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: 每页返回数量。
    AccountsCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 账号列表的不透明游标，省略或传入空字符串时读取第一页；续页原样回传上次响应的 data.next_cursor。 仅适用于签发时的 workspace。非法、重复传入或跨 workspace
        使用时返回 400 invalid_request（numeric_code=10000）。
    AccountsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每页最多返回的账号数。省略时为 20；非法值或重复传入时返回 400 invalid_request（numeric_code=10000）。续页可调整此值。
    ConversationType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ConversationType"
      description: 会话类型；按枚举原值精确匹配，不执行去空格或大小写转换。
    ConversationTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        examples:
          - user
          - group
          - user,group
      description: 会话类型过滤，支持逗号分隔多选；每一项按枚举原值精确匹配，不忽略空项。 可选值为 `user`、`group`、`channel`；非法值返回 400
        invalid_conversation_type。 WhatsApp 的 `group` 包含社群公告群，所有群会话的返回类型均为 `group`。
    ConversationIdQuery:
      name: conversation_id
      in: query
      required: true
      schema:
        type: string
      description: 渠道侧会话标识，部分渠道的标识可能包含 `@`、`:` 等字符。
  requestBodies:
    ActionParams:
      description: 渠道操作参数。支持的字段因渠道和操作而异；空对象表示不传额外参数。
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FreeFormObject"
          examples:
            empty:
              value: {}
    ConversationId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConversationIdRequest"
    ContactId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactIdRequest"
    GroupId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupIdRequest"
  responses:
    BetaFeatureNotEnabled:
      description: 目标工作区未开通内测，无法调用通话接口或显式订阅 call.incoming、call.answered、call.ended。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            request_id: req_example
            error:
              code: beta_feature_not_enabled
              numeric_code: "41002"
              message: Beta feature not enabled
    BadRequest:
      description: 请求体或参数非法。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 缺少或无法校验 API Key。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missingApiKey:
              value:
                request_id: req_xxx
                error:
                  code: missing_api_key
                  numeric_code: "11000"
                  message: Missing X-Api-Key header
    NotFound:
      description: 资源不存在或路由不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 请求与当前资源状态冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AccountWebhookAlreadyExists:
      description: 创建 active 端点或将 inactive 端点改为 active 时，账号已有其他 active Webhook 端点；查询并更新已有 active 端点，或先停用它再启用其他端点。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            accountWebhookAlreadyExists:
              value:
                request_id: req_example_webhook_conflict
                error:
                  code: account_webhook_already_exists
                  numeric_code: "40008"
                  message: Account already has an active webhook endpoint
    InternalError:
      description: 服务器处理请求时发生错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: 服务暂不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedByProvider:
      description: 目标账号所属渠道不支持该能力。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unsupported:
              value:
                request_id: req_xxx
                error:
                  code: unsupported_by_provider
                  numeric_code: "30003"
                  message: Operation not supported by this provider
    BadGateway:
      description: 渠道服务暂不可用或返回了无效响应；Device API 识别到 whatsapp-protocol 账号当前登录受限时使用
        numeric_code=30020，调用方应停止自动重试并引导用户检查官方 WhatsApp 客户端。 Device API 识别到 whatsapp 账号连接未建立时使用
        numeric_code=30021，适用于消息、联系人、群组等操作，message 保留原始连接错误。 调用方应暂停依赖连接的请求，调用 POST
        /v1/accounts/{account_id}/runtime/refresh，按最新状态恢复连接，确认 runtime_status=running 后再发起业务请求。
        该错误不表示已登出或授权失效，也不会自动重发请求、重连或修正账号状态。 numeric_code=30010 表示操作失败，message 在有原因时附带原始错误原因；调用方按数字码判断，不依赖错误文案。
        仅 whatsapp 的群消息发送明确需要管理员权限时使用 numeric_code=34012；停止自动重试，核实群权限和账号角色，由管理员调整后再发送。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unavailable:
              summary: 渠道服务暂不可用
              value:
                request_id: req_example_provider_unavailable
                error:
                  code: provider_unavailable
                  numeric_code: "30002"
                  message: Provider service unavailable
            accountRestricted:
              summary: whatsapp-protocol 账号当前登录受限
              value:
                request_id: req_example_account_restricted
                error:
                  code: provider_unavailable
                  numeric_code: "30020"
                  message: Account login is restricted. Check the official WhatsApp app for details.
            connectionDisconnected:
              summary: 账号连接未建立
              value:
                request_id: req_example_connection_disconnected
                error:
                  code: provider_unavailable
                  numeric_code: "30021"
                  message: "example operation: websocket not connected"
            operationFailed:
              summary: 渠道操作失败并附带原始原因
              value:
                request_id: req_example_operation_failed
                error:
                  code: provider_unavailable
                  numeric_code: "30010"
                  message: "Provider operation failed: Example operation could not be completed"
    OkResult:
      description: 操作成功。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/OkData"
    ActionResult:
      description: 渠道操作结果，返回字段因操作和渠道而异。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/FreeFormObject"
    StartCodeAuthResult:
      description: 验证码授权启动结果；按渠道区分手机号配对与验证码提交。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/StartCodeAuthData"
          examples:
            whatsappPhonePairing:
              summary: WhatsApp
              description: 将 data.verify_code 展示给用户在手机端输入，无需提交到 /auth/code。
              value:
                request_id: <REQUEST_ID>
                data:
                  provider: whatsapp
                  action: start_auth
                  status: awaiting_code
                  auth_status: awaiting_code
                  verify_code: ABCD-EFGH
            telegramVerificationCode:
              summary: Telegram
              description: 等待用户收到验证码后通过 /auth/code 提交；响应不包含用户的验证码。
              value:
                request_id: <REQUEST_ID>
                data:
                  provider: telegram
                  action: start_auth
                  status: awaiting_code
                  auth_status: awaiting_code
                  auth_payload:
                    type: code
    QRAuthCheckResult:
      description: 当前二维码授权步骤。调用方应根据标准状态区分二维码、验证码、自动验证与 Passkey。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/QRAuthCheckData"
          examples:
            qrCode:
              summary: 等待扫描二维码
              value:
                request_id: req_xxx
                data:
                  provider: whatsapp
                  action: check_qr_auth
                  status: awaiting_qr_scan
                  auth_status: awaiting_qr_scan
                  auth_payload:
                    qr_code: data:image/png;base64,<redacted>
            tiktokTwoFactor:
              summary: TikTok 扫码后需要提交验证码
              value:
                request_id: req_xxx
                data:
                  provider: tiktok
                  action: check_qr_auth
                  status: awaiting_code
                  auth_status: awaiting_code
                  auth_payload:
                    type: code
            passkeyRequired:
              summary: 需要完成 Passkey 验证
              value:
                request_id: req_xxx
                data:
                  provider: whatsapp
                  action: check_qr_auth
                  status: passkey_required
                  auth_status: passkey_required
                  auth_payload:
                    type: passkey
                    public_key:
                      allowCredentials: []
                      challenge: base64url-challenge-placeholder
                      rpId: whatsapp.com
                      timeout: 600000
                      userVerification: required
    ProviderAuthSessionCreated:
      description: Provider 授权会话已创建。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ProviderAuthSession"
          examples:
            passkeyRequired:
              value:
                request_id: req_xxx
                data:
                  account_id: acc_xxx
                  provider: whatsapp
                  auth_mode: qrcode
                  status: passkey_required
                  auth_payload:
                    type: passkey
                    public_key:
                      challenge: base64url-challenge
                  authorize_url: https://provider-auth.unifyport.ai/authorize/whatsapp/session-token-placeholder
                  expires_at: 2026-08-12T08:10:00Z
                  switchable: false
                  available_auth_modes:
                    - qrcode
    RuntimeActionResult:
      description: 账号运行态动作结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/RuntimeActionResult"
  schemas:
    CreateCallRequest:
      type: object
      required:
        - account_id
        - to
        - media_type
      properties:
        account_id:
          type: string
          pattern: ^acc_[A-Za-z0-9][A-Za-z0-9_-]*$
          description: 当前工作空间内账号的公开 ID。
        to:
          allOf:
            - $ref: "#/components/schemas/Recipient"
          description: 与发送消息共用目标结构，id 使用 conversation_id。首期仅支持 WhatsApp user 的数字 @lid 或 @s.whatsapp.net 单聊 JID（最长 128
            字符），不接受手机号字符串；group、channel 暂不支持。
        media_type:
          type: string
          enum:
            - voice
            - video
    CreateCallData:
      type: object
      required:
        - call_id
        - direction
        - media_type
        - state
        - join_url
        - expires_at
      properties:
        call_id:
          type: string
        direction:
          type: string
          enum:
            - outbound
        media_type:
          type: string
          enum:
            - voice
            - video
        state:
          type: string
          enum:
            - preparing
        join_url:
          type: string
          format: uri
          description: 原样传递的短期一次性 HTTPS 通话链接，禁止记录完整链接。
        expires_at:
          type: string
          format: date-time
          description: RFC3339 格式的准备失效时间；从创建通话起默认 2 分钟，可由服务端调整，请以此字段判断截止时间，不要自行写死时长。
    ActiveCallData:
      type: object
      additionalProperties: false
      required:
        - call_id
        - state
        - direction
        - media_type
      properties:
        call_id:
          type: string
          maxLength: 128
        state:
          type: string
          enum:
            - preparing
            - dialing
            - ringing
            - connecting
            - active
        direction:
          type: string
          enum:
            - inbound
            - outbound
        media_type:
          type: string
          enum:
            - voice
            - video
    EndedCallData:
      type: object
      additionalProperties: false
      required:
        - call_id
        - state
        - direction
        - media_type
      properties:
        call_id:
          type: string
          maxLength: 128
        state:
          type: string
          enum:
            - ended
            - failed
        direction:
          type: string
          enum:
            - inbound
            - outbound
        media_type:
          type: string
          enum:
            - voice
            - video
    PostResourceID:
      type: string
      minLength: 1
      pattern: \S
      description: 第三方字符串标识；按原值传递，不转换为数字。
    PostAuthor:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/PostResourceID"
        display_name:
          type: string
          description: 可靠取得时保留原文，包括空字符串；未知时省略。
        avatar_url:
          type: string
          minLength: 1
          description: 可靠取得的非空头像地址；未知时省略。
    Post:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/PostResourceID"
        text:
          type: string
          description: 可靠取得时保留原文，包括空字符串；未知时省略。
        author:
          $ref: "#/components/schemas/PostAuthor"
        created_at:
          type: string
          format: date-time
          description: 可靠取得的创建时间，RFC3339 UTC；未知时省略。
    PostComment:
      type: object
      additionalProperties: false
      required:
        - id
        - post_id
      properties:
        id:
          $ref: "#/components/schemas/PostResourceID"
        post_id:
          $ref: "#/components/schemas/PostResourceID"
        text:
          type: string
          description: 可靠取得时保留原文，包括空字符串；未知时省略。
        author:
          $ref: "#/components/schemas/PostAuthor"
        created_at:
          type: string
          format: date-time
          description: 可靠取得的评论创建时间，RFC3339 UTC；未知时省略，不用观察时间代替。
        parent_comment_id:
          $ref: "#/components/schemas/PostResourceID"
          description: 仅在确认父子关系后提供；缺失本身不能证明该评论是可回复的一级评论。
    PostListResult:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          description: 不透明游标，仅 has_more=true 时提供，调用方原样传回。
      oneOf:
        - properties:
            has_more:
              const: true
          required:
            - next_cursor
        - properties:
            has_more:
              const: false
          not:
            required:
              - next_cursor
    PostCommentListResult:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostComment"
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          description: 不透明游标，仅 has_more=true 时提供，调用方原样传回。
      oneOf:
        - properties:
            has_more:
              const: true
          required:
            - next_cursor
        - properties:
            has_more:
              const: false
          not:
            required:
              - next_cursor
    PostInfoRequest:
      type: object
      additionalProperties: false
      required:
        - post_id
      properties:
        post_id:
          $ref: "#/components/schemas/PostResourceID"
    PostCommentListRequest:
      type: object
      additionalProperties: false
      required:
        - post_id
      properties:
        post_id:
          $ref: "#/components/schemas/PostResourceID"
        cursor:
          type: string
          minLength: 1
          description: 原样传回上一页的 next_cursor；首次请求省略。
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    PostCommentReplyRequest:
      type: object
      additionalProperties: false
      required:
        - post_id
        - text
      properties:
        post_id:
          $ref: "#/components/schemas/PostResourceID"
        comment_id:
          $ref: "#/components/schemas/PostResourceID"
          description: 省略时发布一级评论；提供时表示回复目标帖子下的一级评论，不预先确认其所属帖子或层级。显式空串、纯空白、null 或非字符串均不合法。
        text:
          type: string
          minLength: 1
          pattern: \S
          description: 非空白正文，保留原文，不自动删除首尾空格。
    PostCommentReplyResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - accepted
        comment:
          $ref: "#/components/schemas/PostComment"
          description: 仅可靠取得本次新评论回执时提供，不保证每次都有。发布一级评论时不含 parent_comment_id；回复时 parent_comment_id 与请求 comment_id 一致。
    PostCommentCreatedWebhookEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 稳定事件 ID；重复通知、重试和正文补全不会改变，接收方据此去重。
        type:
          type: string
          enum:
            - post.comment.created
        provider:
          type: string
          enum:
            - tiktok
        account_id:
          type: string
          minLength: 1
          description: 平台账号 ID。
        occurred_at:
          type: string
          format: date-time
          description: 可信发生时间，缺失时为观察时间；不等价于评论创建时间，重试保持原值。
        data:
          type: object
          additionalProperties: false
          required:
            - post
            - comment
          properties:
            post:
              $ref: "#/components/schemas/Post"
            comment:
              $ref: "#/components/schemas/PostComment"
              description: post_id 必须与 data.post.id 完全一致。
            account:
              type: object
              additionalProperties: false
              required:
                - provider_account_ref
              properties:
                provider_account_ref:
                  type: string
                  minLength: 1
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          description: 服务端生成的请求 ID。
        client_request_id:
          type: string
          description: 当客户端请求头传入合法 `X-Request-Id` 时回显。
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseMeta"
        - type: object
          required:
            - error
          properties:
            error:
              $ref: "#/components/schemas/Error"
    Error:
      type: object
      required:
        - code
        - numeric_code
        - message
      properties:
        code:
          type: string
          description: 稳定的机器可读错误码。
          examples:
            - invalid_request
        numeric_code:
          type: string
          pattern: ^[1-9][0-9]{4}$
          description: Device API 分配的五位数字字符串错误码；Provider 细分原因可以在不改变 HTTP 和 code 的前提下覆盖默认值。whatsapp 发送时的账号受限使用
            20102，与该渠道账号受限回调的数字码一致；whatsapp-protocol 同步账号受限仍使用 30020。仅 whatsapp 群消息发送明确需要管理员权限时使用 34012，保持
            HTTP 502 和 code=provider_unavailable。仅 whatsapp 添加联系人明确未将目标号码识别为有效联系人时使用 35009，保持 HTTP 500 和
            code=create_contact_failed，不确认号码未注册或永久不可用。
          examples:
            - "10000"
        message:
          type: string
          description: "面向开发者的错误说明，不建议作为客户端分支依据。 numeric_code=30010 时，有原始原因则为 Provider operation failed: <原始错误原因>，没有则为
            Provider operation failed。 numeric_code=30021 时保留原始连接错误，原因缺失时为 Account is not connected to the
            messaging platform。 numeric_code=34012 时为 Group administrator privileges are required to send
            messages to this group，表示当前账号的群消息发送被明确拒绝为需要管理员权限，不反推群类型、具体群设置或账号角色。 numeric_code=35009
            时保留完整原始原因，不增加前缀；原因缺失时为 Target phone number was not recognized as an active WhatsApp contact。
            numeric_code=36007 时提供具体贴纸素材校验原因，原因缺失时为 Invalid sticker media。
            贴纸素材准备失败及实际发送失败保留既有错误分类和专属提示，并提供可用的具体失败原因；原因缺失时沿用默认提示。 这些细分原因保留所在接口既有的 HTTP 状态和 code；调用方应按
            numeric_code 判断，不依赖可变化的文案。"
    FreeFormObject:
      type: object
      additionalProperties: true
    SessionImportRequest:
      type: object
      description: provider 会话导入参数。`whatsapp-protocol` 的协议凭证使用同名嵌套对象； 其他 provider 的既有自由字段通过 additionalProperties 保持兼容。
      properties:
        session_url:
          type: string
          format: uri
        whatsapp-protocol:
          $ref: "#/components/schemas/WhatsAppProtocolSessionImportParams"
      additionalProperties: true
    WhatsAppProtocolSessionImportParams:
      type: object
      description: WhatsApp Protocol 的会话导入凭证，仅可提交至账号会话导入接口。 响应不回显协议密钥或其他敏感凭证。手机号用于身份一致性校验；协议公钥、协议私钥
        仅供上游启动使用。`edge_routing` 由平台固定注入，业务方不得提交。
      required:
        - phone
        - static_pub_key
        - static_pri_key
        - identity_pub_key
        - identity_pri_key
      properties:
        phone:
          type: string
          minLength: 1
          description: 允许带空格、连字符、括号或加号的格式化输入；服务端会归一化为正数字符串。
          examples:
            - <normalized-phone>
        platform:
          type: integer
          format: int32
        app_version:
          type: string
          examples:
            - <app-version>
        server_address:
          type: string
          examples:
            - <provider-server-address>
        fallback_server_addresses:
          type: array
          items:
            type: string
        country:
          type: string
          examples:
            - <country-code>
        device:
          type: integer
          format: uint32
        static_pub_key:
          type: string
          minLength: 1
          description: 协议公钥。
          writeOnly: true
          examples:
            - <base64-public-key>
        static_pri_key:
          type: string
          minLength: 1
          description: 协议私钥。
          writeOnly: true
          examples:
            - <base64-private-key>
        identity_pub_key:
          type: string
          minLength: 1
          description: 身份公钥。
          writeOnly: true
          examples:
            - <base64-public-key>
        identity_pri_key:
          type: string
          minLength: 1
          description: 身份私钥。
          writeOnly: true
          examples:
            - <base64-private-key>
        hash:
          type: string
          description: 兼容旧调用方保留；当前值会被忽略且不保存，建议调用方省略。
          writeOnly: true
          deprecated: true
        peer_kem_public:
          type: string
          description: 对端 KEM 公钥。
          writeOnly: true
          examples:
            - <base64-kem-public-key>
        auth_hex_data:
          type: string
          description: 当前认证十六进制数据。
          writeOnly: true
          examples:
            - <hex-auth-data>
        authhexdata:
          type: string
          description: 兼容旧字段：认证十六进制数据。
          writeOnly: true
          deprecated: true
          examples:
            - <hex-auth-data>
        pq_handshake_mode:
          type: string
          examples:
            - <handshake-mode>
        use_xxkem_handshake:
          type: boolean
      additionalProperties: false
    StartCodeAuthData:
      type: object
      required:
        - provider
        - action
      description: 授权动作的结果，字段随渠道和当前授权步骤变化。 WhatsApp 配对码位于 `verify_code`；Telegram 可通过 `auth_payload.type=code`
        提示等待用户提交验证码。`account_id`、`auth_fields` 和 `expires_at` 不是此动作的统一返回字段，不能按授权状态查询的响应结构读取本接口。
      properties:
        provider:
          $ref: "#/components/schemas/ProviderName"
        action:
          type: string
          enum:
            - start_auth
        status:
          type: string
          description: 当前授权流程状态；awaiting_code 表示等待用户操作，authorized 才表示授权完成。
        auth_status:
          type: string
          description: 当前授权步骤的标准状态，通常与 status 一致。
        verify_code:
          type: string
          description: 仅 WhatsApp 手机号配对返回；直接位于 data 下，不在 auth_payload 内。 展示给用户在手机 WhatsApp 中输入，不回传 /auth/code。
            响应不保证提供过期时间，配对码失效时需重新发起配对。
        auth_payload:
          type: object
          description: 渠道特定的授权提示；Telegram 可返回 type=code，不包含用户收到的验证码。
          properties:
            type:
              type: string
              description: 当前授权提示的类型；Telegram 验证码步骤为 code。
          additionalProperties: true
      additionalProperties: true
    QRAuthCheckData:
      type: object
      description: 二维码授权检查的标准结果。字段可能因渠道和当前步骤扩展；调用方应优先读取 `status`、`auth_status` 和 `auth_payload`。TikTok 扫码后可能返回
        `awaiting_code`，自动处理验证码时返回 `pending`。`account_id`、`expires_at` 等字段不是所有 Provider 都稳定返回，因此不作为必填字段。
      properties:
        provider:
          $ref: "#/components/schemas/ProviderName"
        action:
          type: string
          const: check_qr_auth
        status:
          type: string
          description: 当前授权流程状态，例如 `awaiting_qr_scan`、`awaiting_code`、`pending`、`passkey_required` 或 `authorized`。
        auth_status:
          type: string
          description: 与当前授权步骤对应的标准状态，通常与 `status` 一致。
        auth_payload:
          $ref: "#/components/schemas/QRAuthCheckPayload"
      additionalProperties: true
    QRAuthCheckPayload:
      type: object
      description: 当前步骤所需的标准载荷。普通二维码使用 `qr_code`；验证码步骤使用 `type=code`；Passkey 使用 `type=passkey` 和
        `public_key`。互斥步骤的载荷 不会同时出现。
      properties:
        type:
          type: string
          description: 当前载荷类型；验证码步骤为 `code`，Passkey 步骤为 `passkey`。
        qr_code:
          type: string
          description: 普通二维码内容或可直接展示的二维码 data URL。
        public_key:
          $ref: "#/components/schemas/FreeFormObject"
      additionalProperties: true
    ProviderProfile:
      type: object
      description: 账号在渠道侧的资料。下列为标准字段，其他字段因渠道而异。
      properties:
        id:
          type: string
          description: 渠道侧账号标识。WhatsApp 返回 LID 格式；该字段在账号资料同步完成前可能缺失。
        device_id:
          $ref: "#/components/schemas/WhatsAppDeviceID"
          description: 仅 WhatsApp 账号详情在可确认当前授权会话时提供的登录设备编号；未知时省略。重新授权后可能变化，不作为永久设备标识，也不用于比较历史消息来源。
        phone:
          type: string
          description: 账号手机号，已归一化（去除空格、连字符、加号）。
        username:
          type: string
        display_name:
          type: string
          description: 账号展示名称；WhatsApp 按 BusinessName 优先、PushName 回退的规则生成。
        push_name:
          type: string
          description: WhatsApp 当前账号设置的 PushName；其他渠道不定义该字段语义。
        business_name:
          type: string
          description: WhatsApp BusinessName；渠道未返回时该字段缺失。
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          description: 账号头像 URL。
        bio:
          type: string
        platform:
          type: string
          description: 目前仅 WhatsApp 定义并返回该字段，表示配对时的登录平台标识，按不透明字符串透传。取值集合不封闭，客户端必须兼容未知值；其他渠道不定义该字段语义。该字段与 device_platform
            不同。
          example: smba
      additionalProperties: true
    OkData:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
    ProviderName:
      type: string
      enum:
        - telegram
        - whatsapp
        - line
        - twitter
        - facebook
        - zalo
        - tiktok
        - whatsapp-protocol
      description: 响应输出的 canonical provider 名称。`whatsapp-protocol` 仅支持 session，本期支持 text 和 image，以及联系人详情；不支持
        reply、mentions、联系人列表及写动作、会话或群组能力。
    ProviderInputName:
      type: string
      enum:
        - telegram
        - whatsapp
        - line
        - twitter
        - facebook
        - zalo
        - tiktok
        - whatsapp-protocol
        - x
        - x_client
        - twitter_client
      description: provider 输入名称。兼容 `x`、`x_client`、`twitter_client`，这些输入会归一化为 `twitter` 并以 `twitter` 输出；Webhook URL
        path 不适用该别名规则。
    WorkspaceStatus:
      type: string
      enum:
        - active
        - inactive
      description: Workspace 状态。设置为 inactive 后，当前 Workspace 的 API Key 将不再通过鉴权。
    Workspace:
      type: object
      required:
        - name
        - status
        - is_beta
        - account_quota
        - account_quota_used
        - account_quota_unlimited
      properties:
        is_beta:
          type: boolean
          readOnly: true
          default: false
          description: 工作区是否已开通内测，默认关闭；仅服务端可管理，客户不能通过 PATCH 或 metadata 修改。
        name:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        metadata:
          type: object
          additionalProperties:
            type: string
        account_quota:
          type: integer
          format: uint64
          readOnly: true
          description: 当前生效的只读账号总容量，包含免费额度和有效期内的付费额度，不扣除已用数量；已到期的付费额度不计入。
        account_quota_used:
          type: integer
          format: uint64
          readOnly: true
          description: 当前已占用的只读账号额度，账号创建后即占用，删除后释放；待授权、停止或断线的账号仍计入。付费额度到期后，已用额度可能超过 account_quota，按实际已用值返回。
        account_quota_unlimited:
          type: boolean
          readOnly: true
          description: 兼容保留的只读字段，当前配额模式固定返回 false；账号容量以 account_quota 为准。
    WorkspaceUpdateRequest:
      type: object
      required:
        - name
        - status
      not:
        required:
          - is_beta
      properties:
        name:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        metadata:
          type: object
          description: 省略时保留现有 metadata；传入空对象时只清空客户可写字段。 `account_quota`、`account_quota_unlimited` 与 `is_beta`
            是服务端保留键，提交任一保留键返回 `400 invalid_request`；顶层提交 `is_beta` 同样拒绝。
          propertyNames:
            not:
              enum:
                - account_quota
                - account_quota_unlimited
                - is_beta
          additionalProperties:
            type: string
    APIKey:
      type: object
      required:
        - id
        - name
        - key_prefix
        - status
      properties:
        id:
          type: string
          examples:
            - ak_xxx
        name:
          type: string
        key_prefix:
          type: string
          description: 可展示的 Key 前缀，不是完整 API Key。
        status:
          type: string
          enum:
            - active
            - inactive
    APIKeyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        prefix:
          type: string
          description: 生成 API Key 时使用的前缀。省略时使用默认前缀；不接受 null。
    APIKeyCreateResult:
      type: object
      required:
        - key
        - api_key
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        api_key:
          type: string
          description: 完整明文 API Key，仅创建或轮换响应中出现一次。
    APIKeyStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
    AccountOperation:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
        kind:
          type: string
          enum:
            - QUOTE
            - CREATE
            - DELETE
            - COMPENSATE
        state:
          type: string
          enum:
            - QUOTED
            - CONSUMED
            - EXPIRED
            - PENDING
            - PROCESSING
            - SUCCEEDED
            - FAILED
            - REVIEW
        account_id:
          type: string
        last_error_code:
          type: string
      required:
        - operation_id
        - kind
        - state
      description: Safe public business operation result.
    AccountBilling:
      type: object
      additionalProperties: false
      properties:
        period_start_at:
          type: string
          format: date-time
        period_end_at:
          type: string
          format: date-time
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        currency:
          const: USD
          type: string
        operation_id:
          type: string
        state:
          type: string
          enum:
            - ACTIVE
            - DELETING
            - DELETED
            - COMPENSATED
            - REVIEW
      required:
        - period_start_at
        - period_end_at
        - amount_minor
        - currency
        - operation_id
        - state
      description: 独立的资金业务状态，不与 runtime_status 混用；周期时间按 RFC 3339 UTC Z 返回。
    Account:
      type: object
      required:
        - id
        - name
        - provider
        - region
        - status
        - runtime_status
      examples:
        - id: acc_xxx
          name: Customer Support
          provider: whatsapp
          region: sg
          status: active
          runtime_status: running
      properties:
        billing:
          $ref: "#/components/schemas/AccountBilling"
        id:
          type: string
          examples:
            - acc_xxx
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        region:
          type: string
          description: 账号选择的默认网络出口地区。
        status:
          type: string
          description: 账号资源状态，例如 active、inactive、disabled。
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        auth_mode:
          type: string
          description: 授权模式，例如 qrcode、code、session。
        capabilities:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/FreeFormObject"
        provider_account_ref:
          type: string
          description: 渠道侧账号公开标识。
        proxy:
          $ref: "#/components/schemas/FreeFormObject"
          description: 客户显式配置的代理；不返回平台默认出口凭据。
        provider_profile:
          $ref: "#/components/schemas/ProviderProfile"
      allOf:
        - if:
            properties:
              provider:
                not:
                  const: whatsapp
          then:
            properties:
              provider_profile:
                properties:
                  device_id: false
    AccountListResult:
      type: object
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        has_more:
          type: boolean
          description: 是否还有下一页。
        next_cursor:
          type: string
          description: 下一页的不透明游标，仅在 has_more=true 时返回；续页时原样传入 cursor。
    AccountCreateRequest:
      type: object
      description: 创建账号请求。`whatsapp-protocol` 凭证只能提交到 `/v1/accounts/{account_id}/auth/session` 的嵌套
        `whatsapp-protocol` 对象；不能通过 provider_data 提交。`whatsapp-protocol` 账号不能在该 provider 与其他 provider 之间切换。
      required:
        - provider
        - region
        - auth_mode
      properties:
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderInputName"
        region:
          type: string
          minLength: 1
        status:
          type: string
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        auth_mode:
          type: string
          enum:
            - qrcode
            - code
            - session
        capabilities:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/FreeFormObject"
        provider_account_ref:
          type: string
        provider_data:
          $ref: "#/components/schemas/FreeFormObject"
          description: TikTok 可设置 `provider_data.enable_comment` 为 Boolean，默认 false；字符串、数字、null 均返回 400 invalid_request。
            在线修改后需 reconnect 生效，start 成功不证明配置已应用；关闭不撤回已排队事件。 渠道扩展配置。创建 Telegram 账号时，`provider_data.api_id` 和
            `provider_data.api_hash` 均为可选，适用于 `auth_mode=code`、`qrcode` 和 `session`；未指定自定义应用凭证时使用平台默认 Telegram
            应用凭证。 使用自定义应用凭证时，请成对提供同一 Telegram 应用的 `api_id` 和 `api_hash`，两者均使用字符串。
            需要使用平台默认凭证但默认配置不可用时，创建请求失败；平台调整默认凭证不会自动替换已有账号凭证。
        proxy:
          $ref: "#/components/schemas/FreeFormObject"
    AccountUpdateRequest:
      type: object
      description: PATCH 部分更新；字段省略时保留原值，显式 null 不合法，空数组或空对象表示清空对应集合。 实际改变 auth_mode 必须仅提交 auth_mode，不能混入其他字段或未知字段。
        目标模式必须为该渠道支持的方式；相同模式保留原授权。Telegram、WhatsApp 实际切换会清除旧会话，包括已授权会话；成功后须重新授权。 `whatsapp-protocol` 凭证只能提交到
        `/v1/accounts/{account_id}/auth/session` 的嵌套 `whatsapp-protocol` 对象，不能通过 provider_data 提交；不能在
        whatsapp-protocol 与其他 provider 之间切换。
      properties:
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderInputName"
        region:
          type: string
          minLength: 1
        status:
          type: string
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        auth_mode:
          type: string
          enum:
            - qrcode
            - code
            - session
        capabilities:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/FreeFormObject"
        provider_account_ref:
          type: string
        provider_data:
          $ref: "#/components/schemas/FreeFormObject"
          description: 渠道扩展配置；省略整个 `provider_data` 时保留原配置。 TikTok 的 `enable_comment` 仅接受 Boolean，未配置为 false；在线修改后需
            reconnect 生效，关闭不撤回已排队事件。 Telegram 的 `provider_data.api_id` 和 `provider_data.api_hash` 均为可选；
            更新自定义应用凭证时，请成对提供同一 Telegram 应用的两个字段，均使用字符串。 非空配置替换中的缺省凭证字段使用平台默认值；默认配置不可用时，该更新请求失败。
            显式空对象表示清空，不补充默认凭证。
        proxy:
          $ref: "#/components/schemas/FreeFormObject"
          description: 自定义代理优先；清空后恢复账号创建时的默认配置。旧账号沿用原清空行为。
    AccountSession:
      type: object
      required:
        - account_id
        - status
      properties:
        account_id:
          type: string
        status:
          type: string
          description: 授权流程状态，例如 `pending_auth`、`awaiting_qr_scan`、`awaiting_code`、`pending`、`passkey_required`、
            `passkey_pending`、`passkey_confirmation`、`passkey_confirmation_sent`、 `authorized`、`failed`。
        auth_fields:
          type: array
          items:
            $ref: "#/components/schemas/AuthField"
        auth_payload:
          description: 当前授权步骤所需的渠道载荷。Passkey 流程可能返回 `type=passkey` 和 `public_key`，或返回 `type=passkey_confirmation` 及确认提示字段。
          allOf:
            - $ref: "#/components/schemas/FreeFormObject"
        expires_at:
          type: string
          format: date-time
        last_error:
          type: string
    ProviderAuthSession:
      type: object
      required:
        - account_id
        - provider
        - auth_mode
        - status
        - authorize_url
        - expires_at
        - switchable
        - available_auth_modes
      properties:
        account_id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        auth_mode:
          type: string
          examples:
            - qrcode
        status:
          type: string
          examples:
            - pending_auth
            - passkey_required
            - authorized
        auth_payload:
          description: 当前授权步骤所需的渠道载荷，结构会随授权状态变化。
          allOf:
            - $ref: "#/components/schemas/FreeFormObject"
        authorize_url:
          type: string
          format: uri
          description: 短期有效的 Provider 授权页面地址，其中包含不透明授权凭证。调用方应将其 作为敏感信息处理，不得写入公开日志或分享给无关用户。
        expires_at:
          type: string
          format: date-time
        switchable:
          type: boolean
          description: 当前授权会话是否允许切换授权模式。
        available_auth_modes:
          type: array
          description: 当前会话允许使用的授权模式。
          items:
            type: string
    PasskeyResponseRequest:
      type: object
      required:
        - webauthn_response
      properties:
        webauthn_response:
          type: string
          minLength: 1
          description: 浏览器生成的 WebAuthn 凭证响应序列化后的完整 JSON 字符串。
    AuthField:
      type: object
      required:
        - type
        - required
      properties:
        type:
          type: string
        required:
          type: boolean
        label:
          type: string
        placeholder:
          type: string
    RuntimeStatus:
      type: string
      description: 平台标准账号运行态。Provider 原始值不会直接对外返回：`ready`、`online`、 `connected`、`active`、`started` 统一为
        `running`；`offline`、`inactive`、 `stop` 统一为 `stopped`；`failed` 统一为 `error`。
      enum:
        - unknown
        - starting
        - running
        - stopping
        - stopped
        - reconnecting
        - disconnected
        - error
    RuntimeActionResult:
      type: object
      required:
        - account_id
        - provider
        - action
        - operation_status
        - runtime_status
        - runtime_error
      properties:
        account_id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        action:
          type: string
          enum:
            - refresh_status
            - start
            - stop
            - reconnect
        operation_status:
          type: string
          examples:
            - succeeded
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        runtime_error:
          type: string
        auth_required:
          type: boolean
          description: 可选的授权提示。本次 Provider 明确返回二维码、Passkey 等授权证据， 或当前 Session 已持久化此前由 Provider/Webhook 明确确认的授权进行态时 才为
            `true`；不能仅根据 `runtime_status=disconnected` 或 `client_connect=false` 推断。运行态接口不返回二维码、`code`、
            `qrcode`、`auth_payload` 或 `provider_data`；调用方应改用 `/v1/accounts/{account_id}/auth/qr/start` 和
            `/v1/accounts/{account_id}/auth/qr/check` 获取标准授权状态与载荷。
        auth_status:
          type: string
          description: 可选的标准授权状态快照，仅在本次运行态操作取得 Provider 明确授权证据， 或复用当前 Session 中已确认的授权进行态时返回，例如 `pending`、
            `awaiting_qr_scan` 或 `passkey_required`。该字段用于指引调用方进入授权流程， 不替代授权接口返回的完整状态与载荷。
          examples:
            - pending
            - awaiting_qr_scan
            - passkey_required
    ProviderRegionsResponse:
      type: object
      required:
        - provider
        - regions
      properties:
        provider:
          $ref: "#/components/schemas/ProviderName"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionAvailability"
    RegionAvailability:

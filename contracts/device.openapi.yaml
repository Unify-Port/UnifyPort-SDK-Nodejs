            disappearing_messages:
              $ref: "#/components/schemas/ConversationDisappearingMessagesState"
            actor:
              $ref: "#/components/schemas/ConversationStateActor"
              description: 执行本次设置变更的人，未知时省略；不生成消息作者或方向。
            event:
              $ref: "#/components/schemas/ConversationDisappearingMessagesChange"
    MessagePinState:
      type: object
      additionalProperties: false
      required:
        - pinned
      description: 本次置顶状态快照，每次整体替换旧 pin 对象；缺失的有效期也清除旧值，不影响消息其他字段。
      properties:
        pinned:
          type: boolean
          description: true 为置顶，false 为取消；字段必需，不能将缺失当成取消。
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 仅置顶时可有，以秒为单位；未知时省略，0 不代表永久置顶。
        expires_at:
          type: string
          format: date-time
          description: 可靠 changed_at 加正 duration_seconds 得到的到期时间；未知时省略，不能从回调接收时间计算。
      allOf:
        - if:
            type: object
            additionalProperties: true
            required:
              - pinned
            properties:
              pinned:
                const: false
          then:
            type: object
            additionalProperties: true
            properties:
              duration_seconds: false
              expires_at: false
        - if:
            type: object
            additionalProperties: true
            required:
              - expires_at
            properties:
              expires_at:
                type: string
                format: date-time
          then:
            type: object
            additionalProperties: true
            required:
              - duration_seconds
            properties:
              duration_seconds:
                minimum: 1
    MessagePinMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - pin
      description: 仅更新目标消息的置顶状态；不提供或改写原消息类型、方向、正文和发送时间。
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: 被操作的原消息 ID，在 provider、账号和会话范围内不透明；不是本次事件 ID。
        pin:
          $ref: "#/components/schemas/MessagePinState"
    MessagePinParticipant:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: 相应渠道和账号范围内的不透明用户 ID，不要求特定渠道格式。
        type:
          type: string
          enum:
            - user
        name:
          type: string
          minLength: 1
          pattern: \S
          description: 已知的非空显示名称，可省略；不用于参与者身份或事件去重。
    MessagePinChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - change_type
      properties:
        kind:
          type: string
          enum:
            - message_updated
        change_type:
          type: string
          enum:
            - message_pin
        changed_at:
          type: string
          format: date-time
          description: 已知的可靠操作时间，以 RFC3339 UTC 表示并保留精度；未知时省略，occurred_at 不保证可替代此时间。
    MessagePinUpdatedWebhookEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          minLength: 1
          description: 事件幂等键，同次操作重放保持一致；置顶、取消和再次置顶为独立操作。
        type:
          type: string
          enum:
            - message.updated
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
          description: 事件发生时间，未知时可为接收时间；不保证是可靠操作时间，不用于补 changed_at 或计算有效期。
        data:
          type: object
          additionalProperties: true
          required:
            - message
            - event
          properties:
            message:
              $ref: "#/components/schemas/MessagePinMessage"
            actor:
              $ref: "#/components/schemas/MessagePinParticipant"
              description: 执行本次置顶或取消的人，未知时省略；不得用来推测原消息作者。
            sender:
              $ref: "#/components/schemas/MessagePinParticipant"
              description: 可靠的原消息作者，未知时省略；不从 actor 或操作方向兜底。
            conversation:
              type: object
              additionalProperties: true
              required:
                - id
                - type
              properties:
                id:
                  type: string
                  minLength: 1
                  pattern: \S
                type:
                  type: string
                  enum:
                    - user
                    - group
                    - channel
            event:
              $ref: "#/components/schemas/MessagePinChange"
      allOf:
        - if:
            type: object
            additionalProperties: true
            properties:
              data:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: object
                    additionalProperties: true
                    properties:
                      pin:
                        type: object
                        additionalProperties: true
                        required:
                          - expires_at
                        properties:
                          expires_at:
                            type: string
                            format: date-time
          then:
            type: object
            additionalProperties: true
            properties:
              data:
                type: object
                additionalProperties: true
                properties:
                  event:
                    type: object
                    additionalProperties: true
                    required:
                      - changed_at
                    properties:
                      changed_at:
                        type: string
                        format: date-time
    CallMessageCall:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      not:
        required:
          - end_reason
          - ended_by
      properties:
        id:
          type: string
          minLength: 1
          description: 同一次通话保持一致的不透明通话 ID；按 provider 与 account_id 隔离。
        status:
          type: string
          enum:
            - offered
            - accepted
            - ended
          description: offered 表示收到邀请，accepted 表示收到接听确认，ended 表示呼叫尝试或通话结束；均不承诺媒体连接已建立。
        accepted_at:
          type: string
          format: date-time
          description: 仅接听更新可有，可靠的接听确认时间；未知时省略，业务方在结束后仍应保留已有值。
        media_type:
          type: string
          enum:
            - audio
            - video
          description: audio 为语音，video 为视频；未知时省略，省略不清空原记录。
        end_reason:
          type: string
          enum:
            - timeout
            - rejected_elsewhere
          description: 仅 ended 可有；timeout 表示超时，rejected_elsewhere 表示其他端拒接，不确认具体设备或执行方。未知时省略，不抹去已有接听事实，不能单独证明从未接听。
        ended_by:
          type: string
          enum:
            - remote
          description: 仅明确确认对方结束时可有 remote，无法确认时省略；提供 end_reason 时不提供此字段。它不代表我方未接听，也不表示原消息的发起方向。
    CallMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - call
      properties:
        id:
          type: string
          minLength: 1
          description: 通话消息记录 ID；邀请、接听和结束保持一致，仅用于记录关联，不代表支持原生消息操作。
        type:
          type: string
          enum:
            - call
        direction:
          type: string
          enum:
            - inbound
            - outbound
          description: 相对于接入账号的发起方向；首期邀请为 inbound，接听和结束通知省略。
        sent_at:
          type: string
          format: date-time
          description: 可确认的邀请发生时间；缺失时省略，接听和结束通知不提供此字段。
        call:
          $ref: "#/components/schemas/CallMessageCall"
    CallMessageWebhookEvent:
      type: object
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          minLength: 1
          description: 事件幂等键；同一阶段重复投递保持一致，邀请、接听与结束使用不同事件 ID。
        type:
          type: string
          enum:
            - message.received
            - message.updated
        provider:
          type: string
          enum:
            - whatsapp
          description: 首期仅支持 WhatsApp 单聊通话消息。
        account_id:
          type: string
          minLength: 1
          description: Device API 签发的账号 public_id。
        occurred_at:
          type: string
          format: date-time
          description: 本次邀请、接听或结束的发生时间；无法确认时使用接收时间，重试保持不变，但接收时间不会用于填充 accepted_at。
        data:
          type: object
          required:
            - message
          properties:
            message:
              $ref: "#/components/schemas/CallMessage"
            conversation:
              type: object
              required:
                - id
                - type
              properties:
                id:
                  type: string
                  minLength: 1
                  description: 对端 WhatsApp LID；无法确认会话时整个对象省略。
                type:
                  type: string
                  enum:
                    - user
            sender:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  minLength: 1
                  description: 原始通话发起者的 WhatsApp LID；邀请、接听和结束均可提供，不表示接听或结束通知的执行者。
                type:
                  type: string
                  enum:
                    - user
            account:
              type: object
              properties:
                provider_account_ref:
                  type: string
                  description: 渠道侧接入账号引用，无法提供时省略。
            event:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - message_received
                    - message_updated
                  description: 既有消息事件辅助信息；通话识别和状态以 message.type 与 message.call 为准。
    CallMessageReceivedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/CallMessageWebhookEvent"
        - type: object
          properties:
            type:
              enum:
                - message.received
            data:
              properties:
                message:
                  required:
                    - direction
                  properties:
                    direction:
                      enum:
                        - inbound
                    call:
                      properties:
                        status:
                          enum:
                            - offered
                      not:
                        anyOf:
                          - required:
                              - ended_by
                          - required:
                              - accepted_at
                          - required:
                              - end_reason
    CallMessageUpdatedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/CallMessageWebhookEvent"
        - type: object
          properties:
            type:
              enum:
                - message.updated
            data:
              properties:
                message:
                  not:
                    anyOf:
                      - required:
                          - direction
                      - required:
                          - sent_at
                  properties:
                    call:
                      oneOf:
                        - properties:
                            status:
                              enum:
                                - accepted
                          not:
                            anyOf:
                              - required:
                                  - ended_by
                              - required:
                                  - end_reason
                        - properties:
                            status:
                              enum:
                                - ended
                          not:
                            required:
                              - accepted_at
    AccountWebhookError:
      type: object
      required:
        - code
        - numeric_code
        - message
      description: 账号事件中的失败原因，不代表回调 HTTP 投递失败。account_auth_failed / 20100：授权失败，具体原因未确定；按现有授权失败流程处理，不推断具体原因。
        account_logged_out / 20101：当前登录态已失效；引导重新授权。 account_restricted / 20102：当前账号登录受限，不代表已确认封禁；到官方 WhatsApp
        客户端检查并处理，恢复正常后再重新授权。
      properties:
        code:
          type: string
          enum:
            - account_auth_failed
            - account_logged_out
            - account_restricted
          description: 稳定的机器可读失败分类。
        numeric_code:
          type: string
          pattern: ^[1-9][0-9]{4}$
          enum:
            - "20100"
            - "20101"
            - "20102"
          description: 与 code 对应的五位数字字符串，不作为数值计算。
        message:
          type: string
          minLength: 1
          description: 平台维护的英文说明，可以调整文案，不用于客户端分支。

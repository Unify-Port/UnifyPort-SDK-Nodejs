          $ref: "#/components/schemas/MessageCommerceHTTPURL"
        thumbnail_url:
          $ref: "#/components/schemas/MessageCommerceHTTPURL"
        mimetype:
          type: string
          minLength: 1
          pattern: \S
        size:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        duration_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        metadata:
          $ref: "#/components/schemas/MessageInteractiveAttachmentMetadata"
        title:
          type: string
          minLength: 1
          pattern: \S
        description:
          type: string
          minLength: 1
          pattern: \S
        expired:
          type: boolean
          description: WhatsApp 自动历史同步与按需补拉使用相同的历史保留与媒体获取规则：默认每批每会话最多保留最近 100 条消息，并尝试获取已保留的最近 100
            条消息内的受支持交互头部媒体，文本消息也计数。历史保留数量和媒体获取范围可由服务配置独立调整；不设历史条数上限时只处理实际收到的批次，不主动补齐全部历史；不设额外媒体窗口时，对本批已保留消息中的所有受支持交互头部媒体尝试获取。不保证收到
            100 条消息或全部媒体可恢复。获取成功且提供有效 URL 时为 false；获取失败或超出所配置的媒体窗口时为 true。未尝试且状态未知时可省略。媒体恢复后应同时合并本次 url 和

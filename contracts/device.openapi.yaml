          description: 对应渠道及账号范围内的联系人不透明资源 ID，可关联联系人列表中同 ID 的资源；不保证可直接用于会话或详情查询。WhatsApp 详情可能返回映射后的不同 PN 资源
            ID，不能据此自动替换事件资源键或合并不同 PN/LID 记录。
        conversation_id:
          type: string
          minLength: 1
          pattern: \S
          description: 已可靠关联的会话 ID，未知时省略。WhatsApp 的详情查询使用此处已确认的 LID；不能从 contact.id 推算。
        address_book:
          $ref: "#/components/schemas/ContactAddressBook"
    ContactUpdateChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - source
        - changed_fields
      properties:
        kind:
          type: string
          enum:
            - contact_updated
        source:
          type: string
          enum:
            - address_book
            - full_sync
          description: address_book 表示通讯录更新；full_sync 表示收到的同步快照，不表示刚刚手动改名，也不保证完整通讯录或同步完成通知。
        changed_fields:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: 与本次 address_book 中出现的字段精确对应，顺序无含义；表示提供的更新字段，不证明服务端已比较旧值。
          items:
            type: string
            enum:
              - address_book.full_name
              - address_book.first_name
        changed_at:
          type: string
          format: date-time
          description: 可靠的名称变更时间，以 RFC3339 UTC 表示并保留精度；未知时省略，不用 occurred_at 补齐。
    ContactUpdatedData:
      type: object
      additionalProperties: false
      required:
        - contact
        - event
      properties:
        account:
          $ref: "#/components/schemas/ConversationStateAccount"
        contact:
          $ref: "#/components/schemas/ContactUpdateReference"
        event:
          $ref: "#/components/schemas/ContactUpdateChange"
      allOf:
        - if:
            type: object
            additionalProperties: true
            properties:
              contact:
                type: object
                additionalProperties: true
                properties:
                  address_book:
                    type: object
                    additionalProperties: true
                    required:
                      - full_name
                    properties:
                      full_name:
                        type: string
          then:
            type: object
            additionalProperties: true
            properties:
              event:
                type: object
                additionalProperties: true
                properties:
                  changed_fields:
                    type: array
                    contains:
                      const: address_book.full_name
          else:
            type: object
            additionalProperties: true
            properties:
              event:
                type: object
                additionalProperties: true
                properties:
                  changed_fields:
                    type: array
                    not:
                      contains:
                        const: address_book.full_name
        - if:
            type: object
            additionalProperties: true
            properties:
              contact:
                type: object
                additionalProperties: true
                properties:
                  address_book:
                    type: object
                    additionalProperties: true
                    required:
                      - first_name
                    properties:
                      first_name:
                        type: string
          then:
            type: object
            additionalProperties: true
            properties:
              event:
                type: object
                additionalProperties: true
                properties:
                  changed_fields:
                    type: array
                    contains:
                      const: address_book.first_name
          else:
            type: object
            additionalProperties: true
            properties:
              event:
                type: object
                additionalProperties: true
                properties:
                  changed_fields:
                    type: array
                    not:
                      contains:
                        const: address_book.first_name
    ContactUpdatedWebhookEvent:
      type: object

                      kind: message_updated
      responses:
        2XX:
          description: 业务方已接收并接受处理该编辑事件，重复投递也应幂等接受。
  conversationHistory:
    post:
      summary: 按需补拉的会话历史消息
      description: provider=whatsapp 的私聊历史补拉复用 conversation.history；按需批次携带
        data.history.source=on_demand，自动历史同步不要求该字段。 data.messages[] 是扁平消息数组，能够确定会话的空批次可返回
        messages=[]；无法确定会话时不会补造会话或消息。 自动历史同步与按需补拉使用相同的历史保留与媒体获取规则：默认每批每会话最多保留最近 100 条消息，并按已保留的最近 100
        条消息（文本消息也计数），对当前支持的普通附件、商品图片和交互头部媒体尝试获取资源。历史保留数量和媒体获取范围可由服务配置独立调整；不设历史条数上限时仍只处理实际收到的批次，不主动补齐全部历史；不设额外媒体窗口时，对本批已保留消息中的所有受支持媒体尝试获取。不保证收到
        100 条消息或每条媒体都获得可访问的 URL。请求 limit 仍为 1～50，省略时为 50，不控制媒体窗口。 普通附件和交互头部附件获取成功且提供有效 URL 时
        expired=false，获取失败或超出所配置的媒体窗口时为 true；媒体恢复后应同时合并本次 url 和 expired=false，覆盖旧 true，缺失字段不清空旧状态。商品图片仍按实际提供的
        product.image_url 保存，URL 不保证永久有效。 按 provider + account_id + data.conversation.id + data.messages[].id
        逐条合并消息；顶层 id 用于识别重复批次，不能替代逐消息处理，也不能仅因批次 ID 相同而丢弃整批消息。不将回调顺序视为请求顺序。 只有具有原生消息 ID 且 id、sent_at、direction
        完整的内容消息才可构造下一次 before；type=call 的合成通话记录不可用，缺失字段时不使用 occurred_at、当前时间或默认方向替代。 不提供 request_id
        关联、下一页游标、分片进度或完成状态。空批次、消息不足 limit 或等待超时均不表示历史已到底。 按需补拉不触发 account.history.synced，不应将其当作账号初始化完成信号。
      operationId: receiveConversationHistoryWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationHistoryWebhookEvent"
            examples:
              onDemandHistory:
                value:
                  id: evt_example_183342
                  type: conversation.history
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-28T03:01:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    history:
                      source: on_demand
                    messages:
                      - id: MSG_HISTORY_EXAMPLE_001
                        type: text
                        text: Earlier message.
                        direction: inbound
                        sent_at: 2026-09-28T02:00:00Z
                        sender:
                          id: 100000000000002@lid
              emptyOnDemandHistory:
                value:
                  id: evt_example_184219
                  type: conversation.history
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-28T03:02:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    history:
                      source: on_demand
                    messages: []
      responses:
        2XX:
          description: 业务方已可靠接收本次事件，重复投递也应幂等接受；不表示全部历史已完成。
  messageReferralHistory:
    post:
      summary: 历史消息中的广告归因信息
      description: 支持接收历史消息中的广告归因信息，仅适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用
        `conversation.history`；每条历史消息的可选 `referral` 与实时消息使用相同结构。 `data.messages[]`
        是扁平消息对象，同批消息可以没有归因信息；不将实时归因复制给同会话的其他消息。 历史事件只表示本次收到的历史批次，不保证全部消息或全部广告来源均可补齐。 按顶层 `id` 去重，按 `provider +
        account_id + data.conversation.id + data.messages[].id` 与实时消息合并。 缺失 `referral`
        或其中字段表示本次没有提供该信息，不应清空已保存的归因信息。
      operationId: receiveMessageReferralHistoryWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReferralHistoryWebhookEvent"
            examples:
              historyWithAdReferral:
                value:
                  id: evt_example_185631
                  type: conversation.history
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-20T04:00:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    messages:
                      - id: MSG_AD_EXAMPLE_001
                        type: text
                        text: I would like to know more.
                        direction: inbound
                        sent_at: 2026-09-20T03:00:00Z
                        sender:
                          id: 100000000000002@lid
                          name: Example customer
                        referral:
                          source: ad
                          source_id: ad_example_001
                          source_url: https://example.com/ad?campaign=demo&content=example
                          title: Example promotion
                          body: Learn more about the product.
                          media_type: image
                          thumbnail_url: https://example.com/ad-thumbnail.jpg
                          media_url: https://example.com/ad-image.jpg
                          provider_extensions:
                            whatsapp:
                              ctwa_clid: click_example_001
                              greeting_message_body: Hello! How can we help?
                              automated_greeting_message_shown: true
                              automated_greeting_message_cta_type: example_cta
                              source_app: example_app
                              click_to_whatsapp_call: true
                              contains_auto_reply: false
                              contains_ctwa_flows_auto_reply: false
                      - id: MSG_NORMAL_EXAMPLE_002
                        type: text
                        text: Thank you.
                        direction: inbound
                        sent_at: 2026-09-20T03:01:00Z
                        sender:
                          id: 100000000000002@lid
      responses:
        2XX:
          description: 业务方已接收并接受处理该批次，重复投递也应幂等接受。
  callMessageReceived:
    post:
      summary: WhatsApp 通话消息创建事件
      description: 本节描述现有 `message.received` 事件中 `data.message.type=call` 的通话子类型； 首期仅支持 `whatsapp`，不包含
        `whatsapp-protocol` 或群通话，不改变普通消息格式。 同时订阅 `message.received` 和 `message.updated` 可接收邀请、接听与结束通知，沿用
        endpoint 的签名配置。 邀请创建一条通话消息，`offered` 不表示已接听。媒体类型未知时省略。 按顶层 `id` 去重，按 `provider + account_id +
        data.message.id` 关联消息记录。 已接听或已结束记录收到迟到邀请时只补全缺失字段，不恢复来电状态，不再次提醒。 通话消息 ID
        仅用于记录关联，不代表支持发送、回复、编辑、撤回或转发该记录。
      operationId: receiveCallMessageReceivedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallMessageReceivedWebhookEvent"
            examples:
              audioInvitation:
                value:
                  id: evt_example_call_offered_001
                  type: message.received
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-17T08:00:00Z
                  data:
                    conversation:
                      id: 100000000000001@lid
                      type: user
                    sender:
                      id: 100000000000001@lid
                      type: user
                    message:
                      id: call_record_example_001
                      type: call
                      direction: inbound
                      call:
                        id: call_example_001
                        media_type: audio
                        status: offered
      responses:
        2XX:
          description: 业务方已接收并接受处理该事件，重复投递也应幂等接受。
  callMessageUpdated:
    post:
      summary: WhatsApp 通话消息状态更新事件
      description: 本节描述现有 `message.updated` 事件中 `data.message.type=call` 的通话子类型； 首期仅支持 `whatsapp`
        单聊，接听确认或收到结束信号时更新原通话记录，不新增第二条消息。 邀请、接听与结束的 `data.message.id`、`data.message.call.id` 相同，三个阶段的顶层事件 `id`
        不同。 通话更新按字段合并，嵌套 `call` 对象也逐字段合并；缺失字段保留原值，不用整个对象替换。 接听和结束通知可提供原通话发起者 `sender` 和对端会话
        `conversation`；无法确认的字段单独省略。 不提供发起方向或原消息发送时间，不能覆盖原消息排序时间；缺少身份字段不影响通知投递。 `accepted` 表示收到接听确认；时间可靠时提供
        `accepted_at`，未知时省略，不携带 `ended_by` 或 `end_reason`。 接听确认可按稳定消息 ID 关联；尚无原记录时补建最小已接听记录。
        结束时没有原记录则补建最小已结束记录；会话缺失时先按消息 ID 保存待关联记录。 状态优先级为 `ended > accepted > offered`，`ended` 为终态；本规则只适用于通话消息。
        迟到接听只补接听事实和时间，不能恢复已结束状态；迟到邀请不能恢复来电或再次提醒。 业务方独立保存已收到接听确认的事实，即使 `accepted_at` 缺失或状态已变为 `ended` 也应保留。
        未收到接听确认仍是未知，不能将记录直接归类为未接来电。接听确认不保证媒体连接已建立， 也不能据此推断拒接、忙线或计算实际媒体通话时长。 结束通知可提供 `end_reason`：`timeout`
        表示收到超时原因，`rejected_elsewhere` 表示其他端拒接， 不推断具体设备或执行方。这两种原因不携带 `ended_by`，未知原因省略，不输出任意原因字符串。
        已有接听事实和时间应继续保留，不能因结束原因覆盖成未接听；无接听事实时可展示“呼叫超时”或“其他端拒接”。
      operationId: receiveCallMessageUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallMessageUpdatedWebhookEvent"
            examples:
              acceptance:
                value:
                  id: evt_example_call_accepted_001
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-17T08:00:05Z
                  data:
                    conversation:
                      id: 100000000000001@lid
                      type: user
                    sender:
                      id: 100000000000001@lid
                      type: user
                    message:
                      id: call_record_example_001
                      type: call
                      call:
                        id: call_example_001
                        status: accepted
                        accepted_at: 2026-09-17T08:00:05Z
              termination:
                value:
                  id: evt_example_call_ended_001
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-17T08:00:10Z
                  data:
                    conversation:
                      id: 100000000000001@lid
                      type: user
                    sender:
                      id: 100000000000001@lid
                      type: user
                    message:
                      id: call_record_example_001
                      type: call
                      call:
                        id: call_example_001
                        status: ended
              timeout:
                value:
                  id: evt_example_call_ended_001
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-17T08:00:30Z
                  data:
                    message:
                      id: call_record_example_001
                      type: call
                      call:
                        id: call_example_001
                        status: ended
                        end_reason: timeout
              rejectedElsewhere:
                value:
                  id: evt_example_call_ended_002
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example_001
                  occurred_at: 2026-09-17T08:01:10Z
                  data:
                    message:
                      id: call_record_example_002
                      type: call
                      call:
                        id: call_example_002
                        status: ended
                        end_reason: rejected_elsewhere
      responses:
        2XX:
          description: 业务方已接收并接受处理该事件；通话状态更新不是回调投递失败。
  accountAuthFailed:
    post:
      summary: WhatsApp 账号授权失效事件
      description: 本节描述 WhatsApp 账号授权失效回调。部分事件在 `data.error` 中提供结构化失败原因， 业务方按 `code` 或 `numeric_code` 分支，不根据
        `message` 判断。 `data.error` 缺失不表示成功，旧事件或其他失败场景可能没有该对象；仍须检查事件类型和状态。 `account_restricted`
        只表示当前登录受限，不代表已确认封禁、永久封禁或固定恢复期限。 原有 `last_error` 保持兼容，账号与会话查询不会因此增加错误对象。
      operationId: receiveAccountAuthFailedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppAccountAuthFailedWebhookEvent"
            examples:
              accountError:
                value:
                  id: evt_whatsapp_example_auth_failed
                  type: account.auth.failed
                  provider: whatsapp
                  account_id: acc_example_account
                  occurred_at: 2026-09-07T01:00:00Z
                  data:
                    auth_status: failed
                    runtime_status: disconnected
                    event:
                      kind: account_auth_status
                      auth_status: failed
                      runtime_status: disconnected
                    error:
                      code: account_restricted
                      numeric_code: "20102"
                      message: Account login is restricted. Check the official WhatsApp app for details.
      responses:
        2XX:
          description: 业务方已接收并接受处理该事件；账号失败不代表回调投递失败。
  accountProfileUpdated:
    post:
      summary: 账号公开资料更新事件
      description: 账号的公开资料完成同步后投递。目前由 WhatsApp 名称或账号头像事件触发。 `display_name` 按 BusinessName 优先、PushName 回退的规则生成；
        `avatar_url` 为空表示当前确认没有可用头像；`changed_fields` 标识本次实际变化字段。 `source` 用于区分全量同步、当前账号主动改名与头像变化。
      operationId: receiveAccountProfileUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileUpdatedWebhookEvent"

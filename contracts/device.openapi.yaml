  /v1/accounts/{account_id}/posts/comments/reply:
    post:
      tags:
        - Posts
      summary: 发布一级评论或回复一级评论
      description: 仅支持 TikTok；省略 comment_id 时发布一级评论，提供非空白字符串 comment_id 时回复指定的一级评论。其他渠道返回 501
        unsupported_by_provider。 不要求帖子属于当前账号；发布或回复无需先查询帖子列表、详情或评论。 接口不预先确认帖子可访问性、评论所属帖子或层级；调用方应提供目标帖子的一级评论
        ID。实际是否允许评论或回复由渠道结果决定，不保证任意帖子都可写入。 第三方 post_id、可选 comment_id 和必填 text 放在 JSON body；正文保留实际发送的原文。
        comment_id 只有省略字段才表示发布一级评论；显式空串、纯空白、null 或非字符串仍返回 400 invalid_request（10000），不会改为发布一级评论。 TikTok 的
        post_id 须为无前导零的正十进制整数字符串；不符合渠道格式时返回 400 provider_invalid_request，comment_id 沿用非空字符串要求。
        账号不存在或不属于当前工作空间返回 404 account_not_found（20020）；非法参数返回 400 invalid_request（10000）。 200
        data.status=accepted 表示请求已被接受，不表示已展示、送达或一定收到 Webhook；仅可靠取得新评论时附带 comment。 发布一级评论的 comment 不含
        parent_comment_id；回复的 comment.parent_comment_id 对应本次请求的 comment_id。
        写入后超时、断连或无法确认回执时结果未知，不自动重发；读取未找到评论或回复不能证明此前未创建。 写入前的
        provider_not_ready、provider_invalid_request、provider_unavailable 分类保持不变；已确认的业务拒绝保留
        provider_invalid_request。 写入后无法确认回执（如超时、断连）返回 502 reply_post_comment_failed（39004），结果可能未知；不自动重试写入。
      operationId: replyPostComment
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:

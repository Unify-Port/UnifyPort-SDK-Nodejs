      tags: [Groups]
      summary: 获取群邀请链接或邀请码
      operationId: getGroupInviteCode
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: group_id
          in: query
          required: true
          schema:
            type: string
          description: provider 侧群 ID。
      responses:
        "200":
          description: 邀请信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/GroupInviteCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/messages:
    post:
      tags: [Messages]
      summary: 发送消息
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            examples:
              text:
                value:
                  account_id: acc_123
                  to:
                    id: target_123
                    type: user
                  message:
                    type: text
                    text: hello
              contact:
                value:
                  account_id: acc_123
                  to:
                    id: 120363413405165529@g.us
                    type: group
                  message:
                    type: contact
                    contacts:
                      - name: 张三
                        phones:
                          - number: "+8613800000000"
                            type: CELL
      responses:
        "200":
          description: 消息发送请求已被接收或完成。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/SendMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/messages/pin:
    post:
      tags: [Messages]
      summary: 置顶或取消置顶消息
      operationId: pinMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagePinRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/messages/revoke:
    post:
      tags: [Messages]
      summary: 撤回消息
      operationId: revokeMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRevokeRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/messages/reaction:
    post:
      tags: [Messages]
      summary: 给消息加表情回应或取消回应
      operationId: reactMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReactionRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/messages/edit:
    post:
      tags: [Messages]
      summary: 编辑消息文本
      operationId: editMessage
      description: 当前主要由支持该能力的 provider 实现，通常仅支持文本消息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEditRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/webhook-endpoints:
    get:
      tags: [Webhook Endpoints]
      summary: 列出 webhook endpoint
      operationId: listWebhookEndpoints
      responses:
        "200":
          description: Webhook endpoint 列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Webhook Endpoints]
      summary: 创建 webhook endpoint
      operationId: createWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
      responses:
        "201":
          description: 创建成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/webhook-endpoints/{endpoint_id}:
    get:
      tags: [Webhook Endpoints]
      summary: 获取 webhook endpoint
      operationId: getWebhookEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: Webhook endpoint 详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Webhook Endpoints]
      summary: 更新 webhook endpoint
      operationId: updateWebhookEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
      responses:
        "200":
          description: 更新后的 webhook endpoint。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Webhook Endpoints]
      summary: 删除 webhook endpoint
      operationId: deleteWebhookEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "204":
          description: 删除成功，无响应体。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/webhook-endpoints/{endpoint_id}/deactivate:
    post:
      tags: [Webhook Endpoints]
      summary: 停用 webhook endpoint
      operationId: deactivateWebhookEndpoint
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: 停用后的 webhook endpoint。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 当前 workspace 的 API Key。

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
      description: Device API 签发的账号 public_id，例如 `acc_xxx`。
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
      description: API Key public_id，例如 `ak_xxx`。
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema:
        type: string
      description: Webhook endpoint public_id，例如 `we_xxx`。
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderName"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 上一次响应返回的 `next_cursor`。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: 每页数量；未提供时的默认值可能因 provider 而异。
    ConversationType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ConversationType"
      description: 会话类型。
    ConversationTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        examples: [user, group, "user,group"]
      description: 会话类型过滤，支持逗号分隔多选。
    ConversationIdQuery:
      name: conversation_id
      in: query
      required: true
      schema:
        type: string
      description: provider 侧会话 ID，因可能包含 `@`、`:` 等字符，固定走 query。

  requestBodies:
    ActionParams:
      description: provider 动作参数。不同 provider 可能支持不同字段；空对象表示不传额外参数。
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FreeFormObject"
          examples:
            empty:
              value: {}
    ConversationId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConversationIdRequest"
    ContactId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactIdRequest"
    GroupId:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GroupIdRequest"

  responses:
    BadRequest:
      description: 请求体或参数非法。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 缺少或无法校验 API Key。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missingApiKey:
              value:
                request_id: req_xxx
                error:
                  code: missing_api_key
                  message: Missing X-Api-Key header
    NotFound:
      description: 资源不存在或路由不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 请求与当前资源状态冲突。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: 服务端内部错误或 provider 链路未映射错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: 服务暂不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnsupportedByProvider:
      description: 当前 provider 不支持该能力。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unsupported:
              value:
                request_id: req_xxx
                error:
                  code: unsupported_by_provider
                  message: Operation not supported by this provider
    BadGateway:
      description: 当前 provider 能力不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OkResult:
      description: 操作成功。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/OkData"
    ActionResult:
      description: provider 动作结果。字段随 action 与 provider 不同而变化。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FreeFormObject"
    RuntimeActionResult:
      description: 账号运行态动作结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ResponseMeta"
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RuntimeActionResult"

  schemas:
    ResponseMeta:
      type: object
      properties:
        request_id:
          type: string
          description: 服务端生成的请求 ID。
        client_request_id:
          type: string
          description: 当客户端请求头传入合法 `X-Request-Id` 时回显。

    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseMeta"
        - type: object
          required: [error]
          properties:
            error:
              $ref: "#/components/schemas/Error"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 稳定的机器可读错误码。
          examples: [invalid_request]
        message:
          type: string
          description: 面向开发者的错误说明，不建议作为客户端分支依据。

    FreeFormObject:
      type: object
      additionalProperties: true

    ProviderProfile:
      type: object
      description: 账号在 provider 侧的公开资料。下列为标准字段，其他字段可能因 provider 而异。
      properties:
        id:
          type: string
          description: provider 侧账号标识。WhatsApp 在资料同步完成后返回 canonical LID（格式为 `{account}@lid`）；其他渠道在取得稳定账号标识后返回。该字段在同步完成前可能缺失。
        phone:
          type: string
          description: 已归一化的账号手机号。
        username:
          type: string
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          description: 账号头像 URL。
        bio:
          type: string
      additionalProperties: true

    OkData:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    ProviderName:
      type: string
      # TikTok 依当前产品口径保留在公开枚举，具体可用性仍以区域接口和账号权限为准。
      enum: [telegram, whatsapp, line, twitter, x, zalo, tiktok]
      description: 正式对外开放的 provider 名称；实际可分配区域以 provider regions 接口为准。

    Workspace:
      type: object
      required: [name, status, account_quota, account_quota_unlimited]
      properties:
        name:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        account_quota:
          type: integer
          format: uint64
        account_quota_unlimited:
          type: boolean

    WorkspaceUpdateRequest:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    APIKey:
      type: object
      required: [id, name, key_prefix, status]
      properties:
        id:
          type: string
          examples: [ak_xxx]
        name:
          type: string
        key_prefix:
          type: string
          description: 可展示的 Key 前缀，不是完整 API Key。
        status:
          type: string
          enum: [active, inactive]

    APIKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        prefix:
          type: string
          description: 生成 API Key 时使用的前缀。

    APIKeyCreateResult:
      type: object
      required: [key, api_key]
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        api_key:
          type: string
          description: 完整明文 API Key，仅创建或轮换响应中出现一次。

    APIKeyStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]

    Account:
      type: object
      required: [id, name, provider, region, status]
      properties:
        id:
          type: string
          examples: [acc_xxx]
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        region:
          type: string
        status:
          type: string
          description: 账号资源状态，例如 active、inactive、disabled。
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        auth_mode:
          type: string
          description: 授权模式，例如 qrcode、code、session。
        capabilities:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/FreeFormObject"
        provider_account_ref:
          type: string
          description: provider 侧账号公开标识。
        proxy:
          $ref: "#/components/schemas/FreeFormObject"
        provider_profile:
          $ref: "#/components/schemas/ProviderProfile"

    AccountRequest:
      type: object
      required: [provider, region]
      properties:
        name:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        region:
          type: string
        status:
          type: string
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        auth_mode:
          type: string
        capabilities:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/FreeFormObject"
        provider_account_ref:
          type: string
        provider_data:
          $ref: "#/components/schemas/FreeFormObject"
        proxy:
          $ref: "#/components/schemas/FreeFormObject"

    AccountSession:
      type: object
      required: [account_id, status]
      properties:
        account_id:
          type: string
        status:
          type: string
          description: 授权流程状态，例如 pending_auth、awaiting_qr_scan、authorized、failed。
        auth_fields:
          type: array
          items:
            $ref: "#/components/schemas/AuthField"
        auth_payload:
          $ref: "#/components/schemas/FreeFormObject"
        expires_at:
          type: string
        last_error:
          type: string

    AuthField:
      type: object
      required: [type, required]
      properties:
        type:
          type: string
        required:
          type: boolean
        label:
          type: string
        placeholder:
          type: string

    RuntimeStatus:
      type: string
      enum: [unknown, starting, running, stopping, stopped, reconnecting, disconnected, error]

    RuntimeActionResult:
      type: object
      required: [account_id, provider, action, operation_status, runtime_status, runtime_error]
      properties:
        account_id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderName"
        action:
          type: string
          enum: [refresh_status, start, stop, reconnect]
        operation_status:
          type: string
          examples: [succeeded]
        runtime_status:
          $ref: "#/components/schemas/RuntimeStatus"
        runtime_error:
          type: string

    ProviderRegionsResponse:
      type: object
      required: [provider, regions]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderName"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionAvailability"

    RegionAvailability:
      type: object
      required: [region, supported, allocatable]
      properties:
        region:
          type: string
        supported:
          type: boolean
        allocatable:
          type: boolean

    ConversationType:
      type: string
      enum: [user, group, channel]

    Conversation:
      type: object
      required: [conversation_id, type, title, avatar_url, unread_count, is_pinned, is_muted]
      properties:
        conversation_id:
          type: string
        type:
          $ref: "#/components/schemas/ConversationType"
        title:
          type: string
        username:
          type: string
        avatar_url:
          type: string
        description:
          type: string
        last_message_at:
          type: string
          format: date-time
        last_message_text:
          type: string
        unread_count:
          type: integer
          format: int64
        members_count:
          type: integer
          format: int64
        subscribers_count:
          type: integer
          format: int64
        is_pinned:
          type: boolean
        is_muted:
          type: boolean
        created_at:
          type: string
          format: date-time
        extra:
          $ref: "#/components/schemas/FreeFormObject"

    ConversationListResult:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          type: string
        has_more:
          type: boolean

    ConversationMember:
      type: object
      required: [peer_id, display_name, avatar_url]
      properties:
        peer_id:
          type: string
          description: 成员的 provider 侧稳定标识。WhatsApp 优先返回 LID，缺少 LID 映射时回退 JID；纯手机号位于 `extra.phone`。
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
        joined_at:
          type: string
          format: date-time
        extra:
          $ref: "#/components/schemas/FreeFormObject"

    ConversationMemberListResult:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMember"
        next_cursor:
          type: string
        has_more:
          type: boolean

    ConversationIdRequest:
      type: object
      required: [conversation_id]
      properties:
        conversation_id:
          type: string

    ConversationReadRequest:
      allOf:
        - $ref: "#/components/schemas/ConversationIdRequest"
        - type: object
          dependentRequired:
            up_to_message_id: [up_to_message_sender_id]
            up_to_message_sender_id: [up_to_message_id]
          properties:
            up_to_message_id:
              type: string
              description: 可选。WhatsApp 中与 up_to_message_sender_id 一起发送目标消息的 read receipt；省略两者时标记整个会话已读。
            up_to_message_sender_id:
              type: string
              description: up_to_message_id 对应消息的 provider 原始发送者 ID；群聊应传 webhook data.sender.id。与 up_to_message_id 成对必填。

    ConversationMuteRequest:
      allOf:
        - $ref: "#/components/schemas/ConversationIdRequest"
        - type: object
          properties:
            duration:
              type: integer
              format: int64
              minimum: 0
              description: 相对静音时长，单位秒；0 表示永久静音。
            mute_until:
              type: string
              format: date-time
              description: RFC3339 绝对结束时间，与 `duration` 互斥。

    ConversationLabel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    ConversationLabelListResult:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationLabel"
        next_cursor:
          type: string
        has_more:
          type: boolean

    ConversationLabelUpsertRequest:
      type: object
      required: [name]
      properties:
        label_id:
          type: string
          description: 为空表示新建，非空表示更新。
        name:
          type: string

    ConversationLabelDeleteRequest:
      type: object
      required: [label_id]
      properties:
        label_id:
          type: string

    ConversationLabelDeleteResult:
      type: object
      required: [label_id, deleted]
      properties:
        label_id:
          type: string
        deleted:
          type: boolean
          const: true

    ConversationLabelMembersRequest:
      type: object
      required: [label_id, action, conversation_ids]
      properties:
        label_id:
          type: string
        action:
          type: string
          enum: [add, remove]
        conversation_ids:
          type: array
          minItems: 1
          items:
            type: string

    ConversationLabelMembersResult:
      type: object
      required: [label_id, action, conversation_ids]
      properties:
        label_id:
          type: string
        action:
          type: string
          enum: [add, remove]
        conversation_ids:
          type: array
          items:
            type: string

    Contact:
      type: object
      required: [id, conversation_id, display_name, avatar_url, provider_user_id]
      properties:
        id:
          type: string
        conversation_id:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        provider_user_id:
          type: string
        is_blocked:
          type: boolean
        extra:
          $ref: "#/components/schemas/FreeFormObject"

    ContactListResult:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        next_cursor:
          type: string
        has_more:
          type: boolean

    ContactIdRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id:
          type: string

    ContactBlocklistResult:
      type: object
      required: [blocklist]
      properties:
        blocklist:
          type: array
          items:
            type: string
        dhash:
          type: string

    ContactNoteRequest:
      type: object
      required: [contact_id, note]
      properties:
        contact_id:
          type: string
        note:
          type: string
          description: 传空字符串表示清空备注。

    Group:
      type: object
      required: [id, conversation_id, name, avatar_url]
      properties:
        id:
          type: string
        conversation_id:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        member_count:
          type: integer
          format: int64
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        description:
          type: string
        extra:
          $ref: "#/components/schemas/FreeFormObject"

    GroupListResult:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        next_cursor:
          type: string
        has_more:
          type: boolean

    GroupIdRequest:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string

    GroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        members:
          type: array
          items:
            type: string

    GroupCreateResult:
      type: object
      required: [id]
      properties:
        id:
          type: string

    GroupMemberUpdateRequest:
      type: object
      required: [group_id, action, member_id]
      properties:
        group_id:
          type: string
        action:
          type: string
          enum: [add, remove, promote, demote]
        member_id:
          type: string

    GroupInfoUpdateRequest:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
        name:
          type: string
          maxLength: 100
        description:
          type: string
          description: 传空字符串表示清空描述。
        avatar_url:
          type: string
          format: uri

    GroupJoinRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
        phone:
          type: string
        lid:
          type: string
        requested_at:
          type: string
          format: date-time

    GroupJoinRequestsResult:
      type: object
      required: [group_id, items]
      properties:
        group_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupJoinRequest"

    GroupJoinRequestsUpdateRequest:
      type: object
      required: [group_id, action, member_ids]
      properties:
        group_id:
          type: string
        action:
          type: string
          enum: [approve, reject]
        member_ids:
          type: array
          minItems: 1
          items:
            type: string

    GroupJoinApprovalModeRequest:
      type: object
      required: [group_id, enabled]
      properties:
        group_id:
          type: string
        enabled:
          type: boolean

    GroupInviteCode:
      type: object
      required: [invite_url, invite_code]
      properties:
        invite_url:
          type: string
        invite_code:
          type: string

    Recipient:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: provider 侧接收方 ID。
        type:
          $ref: "#/components/schemas/ConversationType"

    SendMessageRequest:
      type: object
      required: [account_id, to, message]
      properties:
        account_id:
          type: string
        to:
          $ref: "#/components/schemas/Recipient"
        message:
          $ref: "#/components/schemas/MessagePayload"
        provider_data:
          $ref: "#/components/schemas/FreeFormObject"
        reply_to:
          $ref: "#/components/schemas/ReplyTo"
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"

    MessagePayload:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image, video, audio, document, file, contact]
        text:
          type: string
        url:
          type: string
          format: uri
        file_url:
          type: string
          format: uri
        file_key:
          type: string
        caption:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactCard"

    ContactCard:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ContactEmail"
        organization:
          type: string
        title:
          type: string

    ContactPhone:
      type: object
      required: [number]
      properties:
        number:
          type: string
        type:
          type: string

    ContactEmail:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
        type:
          type: string

    ReplyTo:
      type: object
      required: [reply_token]
      properties:
        reply_token:
          type: string
          description: 来自入站事件 `data.message.reply_token` 或发送成功后 `SendMessageResult.reply_token` 的不透明句柄；调用时应原样回传。

    Mention:
      type: object
      required: [id]
      properties:
        id:
          type: string

    SendMessageResult:
      type: object
      required: [message_id, account_id, status]
      properties:
        message_id:
          type: string
        account_id:
          type: string
        status:
          type: string
          examples: [accepted]
        provider_ref:
          type: string
        reply_token:
          type: string
          description: WhatsApp 发送成功后可能同步返回不透明引用句柄；无法生成稳定句柄时省略。该值按敏感数据处理，不要写入日志。

    MessageTargetRequest:
      type: object
      required: [account_id, conversation_id, message_id]
      properties:
        account_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        sender_id:
          type: string
          description: 目标消息作者标识；缺省通常表示账号自身。

    MessagePinRequest:
      allOf:
        - $ref: "#/components/schemas/MessageTargetRequest"
        - type: object
          required: [pinned]
          properties:
            pinned:
              type: boolean
            duration_seconds:
              type: integer
              format: uint32

    MessageRevokeRequest:
      $ref: "#/components/schemas/MessageTargetRequest"

    MessageReactionRequest:
      allOf:
        - $ref: "#/components/schemas/MessageTargetRequest"
        - type: object
          properties:
            emoji:
              type: string
              description: 空字符串表示取消回应。

    MessageEditRequest:
      type: object
      required: [account_id, conversation_id, message_id, content]
      properties:
        account_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        content:
          type: string

    WebhookEndpoint:
      type: object
      required: [id, url, status, signing_enabled]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
        subscribed_events:
          type: array
          items:
            $ref: "#/components/schemas/StandardEventType"
        signing_enabled:
          type: boolean
        retry_policy:
          $ref: "#/components/schemas/FreeFormObject"

    WebhookEndpointRequest:
      type: object
      required: [url, status]
      properties:
        url:
          type: string
          format: uri
        status:
          type: string
        subscribed_events:
          type: array
          items:
            $ref: "#/components/schemas/StandardEventType"
          description: 为空或省略表示接收全部事件。
        signing_secret:
          type: string
          description: 用于签名 webhook 投递的密钥；仅请求中提交，不会在响应中返回。
        retry_policy:
          $ref: "#/components/schemas/FreeFormObject"

    StandardEventType:
      type: string
      enum:
        - "*"
        - message.received
        - message.updated
        - message.deleted
        - message.read
        - message.reaction
        - message.delivered
        - conversation.updated
        - conversation.deleted
        - conversation.cleared
        - conversation.history
        - group.updated
        - group.join_request
        - account.status.updated
        - account.started
        - account.history.synced
        - account.auth.required
        - account.auth.succeeded
        - account.auth.failed

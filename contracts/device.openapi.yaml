  messageLinkPreviewReceived:
    post:
      summary: 链接预览消息接收事件
      description: 当前适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用 `message.received`，消息类型为
        `link_preview`，目标链接必需；标题、摘要和图片仅在有可靠信息时提供。 title/description 保留明确提供的字符串；空字符串表示清空，缺省表示不改，null
        和全空白字符串不是合法值。 WhatsApp 当前不提供接收侧 image_url；该字段保留为公共可选契约，不应从发送请求推断回调一定包含图片。 普通正文包含 URL 不会自动成为预览卡片；可与
        referral 共存，正文和已有引用字段保持各自语义。 自同步可为 outbound，不能将所有 message.received 当成对方发来的消息。 消息 ID 未提供时不能用顶层事件 ID
        替代；只有可靠消息 ID 时才可能提供 reply_token。
      operationId: receiveMessageLinkPreviewReceivedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageLinkPreviewReceivedWebhookEvent"
            examples:
              previewSelfSync:
                summary: 已发送链接预览的自同步，图片未提供
                value:
                  id: evt_example_146824
                  type: message.received
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-22T03:00:00Z
                  data:
                    conversation:
                      id: 100000000000002@lid
                      type: user
                    sender:
                      id: 100000000000001@lid
                      type: user
                    message:
                      id: MSG_PREVIEW_EXAMPLE
                      type: link_preview
                      text: See https://example.com/product
                      direction: outbound
                      link_preview:
                        url: https://example.com/product
                        title: Example product
                        description: Product introduction
                    event:
                      kind: message_received
              previewWithOnlyURL:
                summary: 仅有目标链接，其他公开预览字段未提供

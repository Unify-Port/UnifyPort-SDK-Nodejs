        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/runtime/start:
    post:
      tags:
        - Account Runtime
      summary: 启动账号运行态
      operationId: startAccountRuntime
      description: TikTok 可在 body 中临时传入 Boolean enable_comment 覆盖账号设置；默认沿用 provider_data.enable_comment，缺省 false。 在线
        TikTok 账号重复 start 不保证配置更新，配置变化须通过 reconnect 生效。 HTTP 200 表示启动请求已被接受或由当前状态幂等满足，不等同于账号已经连接成功，
        也不保证本次实际调用了 Provider。WhatsApp 在真正启动前会先只读探测 Provider； `client_connect=true` 是强在线证据，即使同一响应带有滞后的
        QR/Passkey 标签也返回 `running`；`status=init` 且 `client_connect=false` 返回 `starting`，不推断需要授权。 当 Provider
        明确返回需要继续授权的状态时，响应会额外包含 `auth_required=true` 和标准化的 `auth_status`；调用方应转入账号授权接口， 不应把
        `runtime_status=disconnected` 当作启动接口失败并反复重试。Provider 已进入 QR 流程但二维码仍在异步生成时，`auth_status` 为
        `pending`，不会把 Session 写成无二维码内容的 `awaiting_qr_scan`。其他情况下，共享 Session 已处于 `pending`、 `awaiting_qr_scan`
        或 Passkey 进行态时，重复调用只返回当前授权提示，不会 再次启动 Provider 或刷新现有授权流程。
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /v1/accounts/{account_id}/runtime/stop:
    post:
      tags:
        - Account Runtime
      summary: 停止账号运行态
      operationId: stopAccountRuntime
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:

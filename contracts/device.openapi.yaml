    AccountProfileUpdatedWebhookEvent:
      type: object
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
          description: 用于幂等处理的事件 ID。
        type:
          type: string
          enum:
            - account.profile.updated
        provider:
          $ref: "#/components/schemas/ProviderName"
        account_id:
          type: string
          description: device-api 签发的账号 public_id。
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - profile
            - event
          properties:
            account:
              type: object
              description: 渠道账号引用；渠道无法提供引用时可以省略该对象。
              properties:
                provider_account_ref:
                  type: string
                  description: 渠道侧账号标识；无法提供时可以省略。
            profile:
              type: object
              required:
                - display_name
                - push_name
                - avatar_url
              properties:
                display_name:
                  type: string
                  description: 按 BusinessName 优先、PushName 回退规则生成的展示名称。
                push_name:
                  type: string
                  description: 消费时从 Provider 查询到的 WhatsApp 当前 PushName。
                business_name:
                  type: string
                  description: WhatsApp BusinessName；渠道未返回时省略。
                avatar_url:
                  type: string
                  description: 账号当前头像 URL；确认没有可用头像时返回空字符串。
            event:
              type: object
              required:
                - kind
                - source
              properties:
                kind:
                  type: string
                  enum:
                    - account_profile_updated
                source:
                  type: string
                  enum:
                    - full_sync
                    - self_rename
                    - avatar_change
                  description: "`full_sync` 表示全量同步完成后的快照；`self_rename` 表示当前账号主动改名；`avatar_change` 表示账号头像变化。"
                changed_fields:
                  type: array
                  description: 本次相对已保存账号资料实际变化的公开字段；兼容旧事件，字段可以省略。
                  items:
                    type: string
                    enum:
                      - display_name
                      - push_name
                      - business_name
                      - avatar_url

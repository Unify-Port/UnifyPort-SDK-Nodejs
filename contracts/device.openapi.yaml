                            title: Monday
                          - id: option_tuesday
                            title: Tuesday
                        max_selections: 1
                      direction: outbound
                    event:
                      kind: message_received
      responses:
        "200":
          description: 回调已接收。
  messagePollVoteUpdated:
    post:
      tags:
        - Webhooks
      summary: 投票选择更新
      description: 沿用 message.updated 订阅，event.change_type=poll_vote。message.id 是原投票；actor.id 与 voter_id
        是同一投票人，不是原作者。decoded 用完整选择替换此人记录，空数组明确撤票；unavailable 保留旧结果，不提供 selected_option_ids。更新可先于创建到达，先暂存关联；可靠
        voted_at 缺失或冲突时不能凭到达顺序覆盖。此事件不提供操作消息正文、sender、direction、sent_at 或 reply_token。
      operationId: receiveMessagePollVoteUpdatedWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagePollVoteUpdatedWebhookEvent"
            examples:
              selected:
                value:
                  id: evt_example_140068
                  type: message.updated

      type: object
      additionalProperties: false
      description: 群整体发言权限快照，仅来源明确提供时返回。缺失表示未知；false 表示普通成员可发言，不表示当前账号一定可发送。
      properties:
        admins_only:
          type: boolean
          description: true 表示仅管理员发言；false 是明确状态，不能视为缺省。
    GroupListResult:
      type: object
      required:
        - items
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        next_cursor:
          type: string
        has_more:
          type: boolean
    GroupIdRequest:
      type: object
      required:
        - group_id
      properties:
        group_id:
          type: string
    GroupCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
        members:
          type: array
          items:
            type: string
    GroupCreateResult:
      type: object
      required:
        - id
      properties:
        id:
          type: string
    GroupMemberUpdateRequest:
      type: object
      required:
        - group_id
        - action
        - member_id
      properties:
        group_id:
          type: string
        action:
          type: string
          enum:
            - add
            - remove
            - promote
            - demote
        member_id:
          type: string
    GroupInfoUpdateRequest:
      type: object
      required:
        - group_id
      properties:
        group_id:
          type: string
        name:
          type: string
          maxLength: 100
        description:
          type: string
          description: 传空字符串表示清空描述。
        avatar_url:
          type: string
          format: uri
    GroupJoinRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        phone:
          type: string
        lid:
          type: string
        requested_at:
          type: string
          format: date-time
    GroupJoinRequestsResult:
      type: object
      required:
        - group_id
        - items
      properties:
        group_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupJoinRequest"
    GroupJoinRequestsUpdateRequest:
      type: object
      required:
        - group_id
        - action
        - member_ids
      properties:
        group_id:
          type: string
        action:
          type: string
          enum:
            - approve
            - reject
        member_ids:
          type: array
          minItems: 1
          items:
            type: string
    GroupJoinApprovalModeRequest:
      type: object
      required:
        - group_id
        - enabled
      properties:
        group_id:
          type: string
        enabled:
          type: boolean
    GroupInviteCode:
      type: object
      required:
        - invite_url
        - invite_code
      properties:
        invite_url:
          type: string
        invite_code:
          type: string
    Recipient:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          minLength: 1
          description: 渠道侧接收方标识。
        type:
          $ref: "#/components/schemas/ConversationType"
    SendMessageRequest:
      type: object
      required:
        - account_id
        - to
        - message
      allOf:
        - if:
            type: object
            additionalProperties: true
            properties:
              message:
                type: object
                additionalProperties: true
                properties:
                  type:
                    not:
                      const: sticker
          then:
            type: object
            additionalProperties: true
            properties:
              provider_data:
                $ref: "#/components/schemas/SendMessageProviderData"
      properties:
        account_id:
          type: string
          minLength: 1
        to:
          $ref: "#/components/schemas/Recipient"
        message:
          $ref: "#/components/schemas/MessagePayload"
        provider_data:
          type: object
          additionalProperties: true
        reply_to:
          $ref: "#/components/schemas/ReplyTo"
        mentions:
          type: array
          description: 群消息的 @ 目标列表。`type=member` 使用对应 Provider 的成员 `id`； `type=all` 表示 @所有人，仅在 Provider 支持时生效，否则返回
            `unsupported_message_type`。
          items:
            $ref: "#/components/schemas/Mention"
    SendMessageProviderData:
      type: object
      description: 发送消息时使用的渠道扩展参数。字段仅在对应渠道和消息类型支持时生效。
      properties:
        seconds:
          type: integer
          minimum: 0
          description: 音频或视频时长，单位为秒。仅适用于使用 WhatsApp 账号发送的 `audio` 或 `video` 消息；发送 `video` 时取值范围为 0 到 4294967295（uint32）。
        waveform:
          type: string
          description: 音频波形数据。仅适用于使用 WhatsApp 账号发送的 `audio` 消息。 非空值必须使用标准 Base64 编码，且解码后必须是可解析的 JSON
            波形数据；空字符串按未提供处理，其他格式错误返回 HTTP 400 `provider_invalid_request`。
      additionalProperties: true
    MessagePayload:
      allOf:
        - if:
            properties:
              type:
                not:
                  const: link_preview
          then:
            type: object
            additionalProperties: true
            properties:
              link_preview: false
        - if:
            properties:
              type:
                not:
                  const: poll
          then:
            type: object
            additionalProperties: true
            properties:
              poll: false
      oneOf:
        - $ref: "#/components/schemas/TextMessagePayload"
        - $ref: "#/components/schemas/MediaMessagePayload"
        - $ref: "#/components/schemas/ContactMessagePayload"
        - $ref: "#/components/schemas/LinkPreviewMessagePayload"
        - $ref: "#/components/schemas/PollMessagePayload"
        - $ref: "#/components/schemas/StickerMessagePayload"
      discriminator:
        propertyName: type
    StickerMessagePayload:
      type: object
      additionalProperties: false
      description: 公共结构要求恰好一种非空来源；WhatsApp 当前支持 WebP 的 url/file_url，静态、动画及素材兼容性由渠道判定。API 检查基本容器完整性，下载与暂存硬资源上限为 10
        MiB（10485760 字节），不解码或转码；file_key 结构合法但返回 501 unsupported_by_provider。额外字段即使为空也不允许。
      required:
        - type
      oneOf:
        - required:
            - url
          properties:
            url: {}
        - required:
            - file_url
          properties:
            file_url: {}
        - required:
            - file_key
          properties:
            file_key: {}
      properties:
        type:
          type: string
          enum:
            - sticker
        url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        file_url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        file_key:
          type: string
          pattern: \S
    PollMessagePayload:
      type: object
      additionalProperties: false
      required:
        - type
        - poll
      description: 创建投票；不能附带 text、媒体、名片、链接预览或其他消息载荷。渠道限制见发送接口说明。
      properties:
        type:
          type: string
          enum:
            - poll
        poll:
          $ref: "#/components/schemas/SendMessagePoll"
    SendMessagePoll:
      type: object
      additionalProperties: false
      required:
        - question
        - options
        - max_selections
      description: 题目和选项标题保留原文；max_selections 必须是 1 到选项数量之间的整数，不表示投票人数。1.0、1e0 等整数数值与 1
        等价，非整数非法。公共结构不限制题目长度、最大选项数量或标题重复；具体渠道可有额外限制。
      properties:
        question:
          type: string
          minLength: 1
          pattern: \S
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/SendMessagePollOption"
        max_selections:
          type: integer
          minimum: 1
          description: 每位投票者最多可选的选项数量；不得大于 options 数量，该跨字段约束由接口验证。
    SendMessagePollOption:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
          description: 选项原始标题，发送时不 trim、不改大小写或 Unicode 形式。
    LinkPreviewMessagePayload:
      type: object
      additionalProperties: false
      required:
        - type
        - text
        - link_preview
      description: 链接预览发送结构；不能与媒体、名片或其他消息载荷字段混用。渠道支持范围和附加限制见发送接口说明。
      properties:
        type:
          type: string
          enum:
            - link_preview
        text:
          type: string
          minLength: 1
          pattern: \S
          description: 消息正文；WhatsApp 要求其中包含 link_preview.url 的原文。
        link_preview:
          $ref: "#/components/schemas/SendMessageLinkPreview"
    SendMessageLinkPreview:
      type: object
      additionalProperties: false
      required:
        - url
      description: 公共请求只要求目标链接；可选标题和摘要允许空字符串，但不允许 null。WhatsApp 额外要求非空 title/image_url，title 最多 255 个 Unicode
        字符、description 最多 1024 个 Unicode 字符；限制由本项目的渠道发送策略执行。
      properties:
        url:
          $ref: "#/components/schemas/MessageLinkPreviewHTTPURL"
        title:
          type: string
        description:
          type: string
        image_url:
          $ref: "#/components/schemas/MessageLinkPreviewHTTPURL"
    TextMessagePayload:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
          minLength: 1
        caption:
          type: string
    MediaMessagePayload:
      type: object
      required:
        - type
      anyOf:
        - required:
            - url
          properties:
            url: {}
        - required:
            - file_url
          properties:
            file_url: {}
        - required:
            - file_key
          properties:
            file_key: {}
      properties:
        type:
          type: string
          enum:
            - image
            - video
            - audio
            - document
            - file
        url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        file_url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
        file_key:
          type: string
          minLength: 1
        caption:
          type: string
    ContactMessagePayload:
      type: object
      required:
        - type
        - contacts
      properties:
        type:
          type: string
          enum:
            - contact
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ContactCard"
    ContactCard:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        phones:
          type: array
          items:
            $ref: "#/components/schemas/ContactPhone"
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ContactEmail"
        organization:
          type: string
        title:
          type: string
    ContactPhone:
      type: object
      required:
        - number
      properties:
        number:
          type: string
        type:
          type: string
    ContactEmail:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          format: email
        type:
          type: string
    ReplyTo:
      type: object
      required:
        - reply_token
      properties:
        reply_token:
          type: string
          minLength: 1
          description: 来自可引用消息事件 `data.message.reply_token` 或发送响应 `data.reply_token` 的不透明句柄，按原账号及会话原样使用；不能用消息 ID 替代。
    Mention:
      type: object
      description: "@ 目标。`type` 缺省时按 `member` 处理，以兼容旧请求； `type=member` 必须传 `id`，`type=all` 不传 `id` 且仅适用于群聊。"
      properties:
        type:
          type: string
          enum:
            - member
            - all
          default: member
        id:
          type: string
          minLength: 1
          description: "`type=member` 时必填的 Provider 成员标识。"
      anyOf:
        - required:
            - id
          properties:
            type:
              enum:
                - member
        - required:
            - type
          properties:
            type:
              const: all
          not:
            required:
              - id
    SendMessageResult:
      type: object
      required:
        - message_id
        - account_id
        - status
      properties:
        message_id:
          type: string
        account_id:
          type: string
        status:
          type: string
          examples:
            - accepted
        provider_ref:
          type: string
        reply_token:
          type: string
          minLength: 1
          description: WhatsApp 发送成功且可引用上下文完整时返回；包括新发送投票，普通文字可据此引用它。未提供时省略，accepted 状态不因此改变。
    MessageTargetRequest:
      type: object
      required:
        - account_id
        - conversation_id
        - message_id
      properties:
        account_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        sender_id:
          type: string
          description: 目标消息作者标识；缺省通常表示账号自身。
    MessagePinRequest:
      allOf:
        - $ref: "#/components/schemas/MessageTargetRequest"
        - type: object
          required:
            - pinned
          properties:
            pinned:
              type: boolean
            duration_seconds:
              type: integer
              format: uint32
    MessageRevokeRequest:
      $ref: "#/components/schemas/MessageTargetRequest"
    MessageReactionRequest:
      allOf:
        - $ref: "#/components/schemas/MessageTargetRequest"
        - type: object
          properties:
            emoji:
              type: string
              description: 空字符串表示取消回应。
    MessageEditRequest:
      type: object
      required:
        - account_id
        - conversation_id
        - message_id
        - content
      properties:
        account_id:
          type: string
        conversation_id:
          type: string
        message_id:
          type: string
        content:
          type: string
    WebhookEndpoint:
      type: object
      required:
        - id
        - url
        - status
        - signing_enabled
      properties:
        id:
          type: string
        account_id:
          type: string
          minLength: 1
          description: 账号独立端点的公开账号 ID；工作空间端点省略此字段，不返回 null。
        url:
          type: string
          format: uri
          description: 必须是绝对 HTTP(S) URL。
        status:
          type: string
          enum:
            - active
            - inactive
        subscribed_events:
          type: array
          items:
            $ref: "#/components/schemas/StandardEventType"
        signing_enabled:
          type: boolean
        retry_policy:
          $ref: "#/components/schemas/FreeFormObject"
    WebhookEndpointRequest:
      type: object
      description: url 与 status 必填；其他配置按完整更新语义处理。 account_id 为可选公开账号 ID：创建时省略表示工作空间端点，更新时省略保留已有绑定。 同一账号最多一个 active
        独立端点，inactive 可配置多个且不占用 active 名额；创建 active 或将 inactive 改为 active 时，存在其他 active 端点返回 409
        account_webhook_already_exists（40008）。原 active 端点保持 active 的更新允许执行。 更新时提供 account_id
        只校验一致，不能修改端点归属；不接受 null、空白或重复的 account_id。 字段名必须精确使用 account_id；大小写变体返回 400 invalid_request。
      required:
        - url
        - status
      properties:
        account_id:
          type: string
          minLength: 1
          pattern: \S
          description: 可选的公开账号 ID，例如 `acc_example`；创建用于绑定，更新只用于校验原绑定。
        url:
          type: string
          format: uri
          description: 必须是绝对 HTTP(S) URL。
        status:
          type: string
          enum:
            - active
            - inactive
        subscribed_events:
          type: array
          items:
            $ref: "#/components/schemas/StandardEventType"
          description: 为空、省略或包含 `*` 表示接收当前工作区有权接收的全部事件，包括 contact.updated；is_beta=true 的内测工作区还包含
            call.incoming、call.answered、call.ended，无需额外逐项订阅。非内测工作区可以使用通配订阅，但不会收到通话事件；明确订阅通话事件仍返回 403
            beta_feature_not_enabled（41002）。非通配的具体事件列表仅接收列出的事件。每次投递、重试及死信重放均重新核验内测资格，查询异常不放行。呼入暂未开放；message.*
            通话记录不受内测门禁影响。
        signing_secret:
          type: string
          description: 用于签名 webhook 投递的密钥；仅请求中提交，不会在响应中返回。
        retry_policy:
          $ref: "#/components/schemas/FreeFormObject"
    StandardEventType:
      type: string
      enum:
        - "*"
        - contact.updated
        - post.comment.created
        - message.received
        - message.updated
        - message.deleted
        - message.read
        - message.reaction
        - message.delivered
        - call.incoming
        - call.answered
        - call.ended
        - conversation.updated
        - conversation.deleted
        - conversation.cleared
        - conversation.history
        - group.updated
        - group.join_request
        - account.status.updated
        - account.profile.updated
        - account.started
        - account.history.synced
        - account.auth.required
        - account.auth.succeeded
        - account.auth.failed
    WhatsAppDeviceID:
      type: integer
      minimum: 0
      maximum: 65535
      description: 已确认的 WhatsApp 设备编号；0 是有效值，未知时整个字段省略，不返回 null 或空串。
    WhatsAppMessageDeviceSender:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          description: 既有账号级发送者标识，不包含设备后缀，取值规则不因 device_id 改变。
        device_id:
          $ref: "#/components/schemas/WhatsAppDeviceID"
          description: 该实时消息的发送设备编号，未知时省略。
    WhatsAppMessageDeviceWebhookEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - type
        - provider
        - account_id
        - occurred_at
        - data
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - message.received
            - message.updated
        provider:
          type: string
          enum:
            - whatsapp
        account_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          properties:
            sender:
              $ref: "#/components/schemas/WhatsAppMessageDeviceSender"
            account:
              type: object
              additionalProperties: true
              properties:
                provider_account_ref:
                  type: string
            message:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: string
                direction:
                  type: string
                  enum:
                    - inbound
                    - outbound
    ReceivedContactCard:
      type: object
      additionalProperties: false
      description: 接收名片保留完整 vCard 原文和原始顺序；与发送用结构化 ContactCard 分开，不解析重写电话等字段。
      required:
        - vcard
      properties:
        name:
          type: string
          pattern: \S
          description: 来源提供的显示名；未知或空白省略，不代表通讯录清空。
        vcard:
          type: string
          pattern: \S
          description: 完整原文，保留换行、Unicode 和扩展字段；载体非空不等于内容适合直接展示。
    MessageContactCards:
      type: object
      additionalProperties: true
      description: 多名片始终为一个 type=contact 消息和完整有序 contacts；单张旧消息可继续省略 type 并保留 text。编辑出现 contacts
        时整体替换，不支持空数组清空。多名片不提供 reply_token。
      required:
        - contacts
      oneOf:
        - required:
            - text
          properties:
            text:
              type: string
              pattern: \S
            contacts:
              maxItems: 1
        - required:
            - id
            - type
          properties:
            id:
              type: string
              pattern: \S
            text: false
            reply_token: false
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - contact
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceivedContactCard"
    MessageWithOptionalContactCards:
      type: object
      additionalProperties: true
      properties:
        contacts:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReceivedContactCard"
      allOf:
        - if:
            required:
              - contacts
            properties:
              contacts: {}
          then:
            $ref: "#/components/schemas/MessageContactCards"
    MessageLiveLocation:
      type: object
      additionalProperties: true
      description: 仅识别实时位置类型，调用方可提示在 WhatsApp 中查看；不提供坐标、追踪、共享时长、终止状态或回复句柄，不开放此类型发送。
      required:
        - id
        - type
      properties:
        id:
          type: string
          pattern: \S
        type:
          type: string
          enum:
            - live_location
        text: false
        latitude: false
        longitude: false
        location: false
        duration_seconds: false
        ended_at: false
        reply_token: false
    MessageWithOptionalLiveLocation:
      type: object
      additionalProperties: true
      allOf:
        - if:
            required:
              - type
            properties:
              type:
                const: live_location
          then:
            $ref: "#/components/schemas/MessageLiveLocation"
    MessageContactCardsReceivedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.received
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  $ref: "#/components/schemas/MessageContactCards"
    MessageContactCardsUpdatedWebhookEvent:
      allOf:
        - $ref: "#/components/schemas/MessageReferralWebhookEvent"
        - type: object
          additionalProperties: true
          properties:
            type:
              enum:
                - message.updated
            data:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                message:
                  allOf:

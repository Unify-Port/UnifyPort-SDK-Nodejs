                    actor:
                      id: 100000000000002@lid
                      type: user
                    event:
                      kind: message_updated
                      change_type: poll_vote
              unavailable:
                value:
                  id: evt_example_143180
                  type: message.updated
                  provider: whatsapp
                  account_id: acc_example
                  occurred_at: 2026-09-22T03:00:00.123Z
                  data:
                    conversation:
                      id: 120000000000001@g.us
                      type: group
                    message:
                      id: POLL_EXAMPLE
                      type: poll
                      poll_vote:
                        status: unavailable
                        voter_id: 100000000000002@lid
                        voted_at: 2026-09-22T03:00:00.123Z
                        reason: unknown
                    actor:
                      id: 100000000000002@lid
                      type: user
                    event:
                      kind: message_updated
                      change_type: poll_vote
      responses:
        "200":
          description: 回调已接收。
  messagePollHistory:
    post:
      tags:
        - Webhooks
      summary: 历史投票创建内容
      description: 沿用 conversation.history 订阅。历史只补充实际收到的静态投票题目与选项，可与其他消息混合；不重放 poll_vote
        或累计选择结果，不能据此声称恢复全部投票。创建消息仍不提供 reply_token。
      operationId: receiveMessagePollHistoryWebhook
      security: []
      requestBody:

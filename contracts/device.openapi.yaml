openapi: 3.1.0
info:
  title: UnifyPort Device API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Device API 是 UnifyPort 的控制面 HTTP API，用于管理 workspace、API Key、provider 账号、账号授权与运行态、消息发送、会话、联系人、群组以及业务 webhook endpoint。

    本契约仅描述面向 SDK 调用方公开的 `/v1/` 接口，并使用 `X-Api-Key` 解析 workspace 上下文。
servers:
  - url: /
    description: SDK 调用方通过 baseUrl 显式配置 API 根地址。
tags:
  - name: Workspace
    description: 当前 API Key 所属 workspace。
  - name: API Keys
    description: workspace API Key 管理。
  - name: Providers
    description: provider 元数据查询。
  - name: Accounts
    description: provider 账号资源管理。
  - name: Account Auth
    description: provider 账号授权流程。
  - name: Account Runtime
    description: provider 账号运行态控制。
  - name: Conversations
    description: 会话列表、详情、成员、读写状态、静音、置顶与标签。
  - name: Contacts
    description: provider 联系人视图与联系人动作。
  - name: Groups
    description: provider 群组视图与群组动作。
  - name: Messages
    description: 统一消息发送与消息动作。
  - name: Webhook Endpoints
    description: 业务 webhook endpoint 管理。
security:
  - ApiKeyAuth: []
paths:
  /v1/workspace:
    get:
      tags: [Workspace]
      summary: 获取当前 workspace
      operationId: getWorkspace
      responses:
        "200":
          description: 当前 workspace 信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Workspace]
      summary: 更新当前 workspace
      operationId: updateWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: 更新后的 workspace 信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/api-keys:
    get:
      tags: [API Keys]
      summary: 列出 API Key
      operationId: listApiKeys
      responses:
        "200":
          description: API Key 列表。不会返回完整明文 API Key。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [API Keys]
      summary: 创建 API Key
      operationId: createApiKey
      description: 完整 `api_key` 只在创建响应中出现一次，客户端应自行保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
            examples:
              default:
                value:
                  name: 默认密钥
                  prefix: dk_live
      responses:
        "201":
          description: 创建成功，返回一次性明文 API Key 与可持久展示的 Key 元数据。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKeyCreateResult"
              examples:
                created:
                  value:
                    request_id: req_xxx
                    data:
                      key:
                        id: ak_xxx
                        name: 默认密钥
                        key_prefix: dk_live
                        status: active
                      api_key: "<api-key-visible-once>"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/api-keys/{key_id}:
    patch:
      tags: [API Keys]
      summary: 更新 API Key 状态
      operationId: updateApiKeyStatus
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyStatusUpdateRequest"
      responses:
        "200":
          description: 更新后的 API Key 元数据。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/api-keys/{key_id}/rotate:
    post:
      tags: [API Keys]
      summary: 轮换 API Key
      operationId: rotateApiKey
      description: 轮换后返回新的完整 `api_key`，旧完整密钥不可恢复。
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "200":
          description: 轮换成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/APIKeyCreateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/providers/{provider}/regions:
    get:
      tags: [Providers]
      summary: 查询 provider 地区可用性
      operationId: listProviderRegions
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: provider 支持的 region 及是否可分配。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ProviderRegionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/accounts:
    get:
      tags: [Accounts]
      summary: 列出账号
      operationId: listAccounts
      responses:
        "200":
          description: 当前 workspace 下的账号列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Accounts]
      summary: 创建账号
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "201":
          description: 创建成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/accounts/{account_id}:
    get:
      tags: [Accounts]
      summary: 获取账号详情
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: 账号详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Accounts]
      summary: 更新账号
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: 更新后的账号。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Accounts]
      summary: 删除账号
      operationId: deleteAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: 删除成功，无响应体。
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth:
    get:
      tags: [Account Auth]
      summary: 获取账号授权状态
      operationId: getAccountAuthState
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: 当前授权状态。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/AccountSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/accounts/{account_id}/auth/start:
    post:
      tags: [Account Auth]
      summary: 启动验证码类授权
      operationId: startAccountAuth
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/qr/start:
    post:
      tags: [Account Auth]
      summary: 启动二维码授权
      operationId: startAccountQrAuth
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/qr/check:
    post:
      tags: [Account Auth]
      summary: 检查二维码授权结果
      operationId: checkAccountQrAuth
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/code:
    post:
      tags: [Account Auth]
      summary: 提交验证码
      operationId: submitAccountAuthCode
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        description: provider 授权参数。常见字段为 `code`。
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeFormObject"
            examples:
              code:
                value:
                  code: "123456"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/password:
    post:
      tags: [Account Auth]
      summary: 提交二次密码
      operationId: submitAccountAuthPassword
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        description: provider 授权参数。常见字段为 `password`。
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeFormObject"
            examples:
              password:
                value:
                  password: "<password>"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/session:
    post:
      tags: [Account Auth]
      summary: 导入会话授权
      operationId: importAccountAuthSession
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        description: provider 授权参数。常见字段为 `session_url`。
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreeFormObject"
            examples:
              sessionUrl:
                value:
                  session_url: https://example.com/account.session
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/auth/cancel:
    post:
      tags: [Account Auth]
      summary: 取消授权流程
      operationId: cancelAccountAuth
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/ActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/runtime/refresh:
    post:
      tags: [Account Runtime]
      summary: 刷新账号运行态
      operationId: refreshAccountRuntime
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/runtime/start:
    post:
      tags: [Account Runtime]
      summary: 启动账号运行态
      operationId: startAccountRuntime
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/runtime/stop:
    post:
      tags: [Account Runtime]
      summary: 停止账号运行态
      operationId: stopAccountRuntime
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/runtime/reconnect:
    post:
      tags: [Account Runtime]
      summary: 重连账号运行态
      operationId: reconnectAccountRuntime
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/ActionParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/conversations:
    get:
      tags: [Conversations]
      summary: 列出会话
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ConversationTypeFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: label_id
          in: query
          required: false
          schema:
            type: string
          description: 按会话标签过滤。
      responses:
        "200":
          description: 会话分页列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ConversationListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/conversations/info:
    get:
      tags: [Conversations]
      summary: 获取会话详情
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ConversationIdQuery"
        - $ref: "#/components/parameters/ConversationType"
      responses:
        "200":
          description: 会话详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/conversations/members:
    get:
      tags: [Conversations]
      summary: 列出会话成员
      operationId: listConversationMembers
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/ConversationIdQuery"
        - $ref: "#/components/parameters/ConversationType"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 会话成员分页列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/ConversationMemberListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/UnsupportedByProvider"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/accounts/{account_id}/conversations/read:
    post:
      tags: [Conversations]
      summary: 标记会话已读
      operationId: markConversationRead
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationReadRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":

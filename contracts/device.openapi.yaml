          description: 接收成功。
  messageReferralReceived:
    post:
      summary: 带广告归因信息的消息事件
      description: 支持接收消息广告归因信息，仅适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用
        `message.received`，仅在当前消息确有可用来源信息时附加 `data.message.referral`，不产生独立广告事件或新的消息类型。 仅确认广告来源时提供
        `source=ad`；字段缺失表示未知，不能据此推断不是广告来源。 归因信息只属于当前消息，不继承其引用消息的归因。保留 `source_url` 查询参数，不按链接自行推断点击标识。 按顶层 `id`
        去重；提供 `data.message.id` 时，按 `provider + account_id + data.conversation.id + data.message.id` 关联消息，用
        `direction` 判断收发方向。 `data.message.id` 可能缺失，此时仅保存本次事件，不伪造消息关联，也不把顶层事件 `id` 当作消息 ID。
        本节只扩展接收结构，不支持通过发送接口构造广告归因信息。
      operationId: receiveMessageReferralWebhook

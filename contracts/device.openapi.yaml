    ConversationDisappearingMessagesState:
      type: object
      additionalProperties: false
      required:
        - enabled
        - duration_seconds
      description: 本次完整限时消息设置快照；整体替换旧设置，缺失对象不表示关闭，不改变会话其他字段。
      properties:
        enabled:
          type: boolean
          description: true 表示开启，false 表示关闭；不能由缺失值推测关闭。
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: 开启时为正秒数，关闭时明确为 0；不表示每条消息的剩余时间。
      allOf:
        - if:
            type: object
            additionalProperties: true
            required:
              - enabled
            properties:
              enabled:
                const: false
          then:
            type: object
            additionalProperties: true
            properties:
              duration_seconds:
                const: 0
          else:
            type: object
            additionalProperties: true
            properties:
              duration_seconds:
                minimum: 1
    ConversationStateAccount:
      type: object
      additionalProperties: false

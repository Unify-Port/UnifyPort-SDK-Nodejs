  /v1/webhook-endpoints:
    get:
      tags:
        - Webhook Endpoints
      summary: 列出 webhook endpoint
      operationId: listWebhookEndpoints
      description: 省略 account_id 时只列当前工作空间的 Webhook 端点；指定时只列该账号的独立配置。 账号没有独立配置时 data 为 []，不混入继承的工作空间配置。
        显式账号不存在或不属于当前工作空间返回 404 account_not_found（20020）。
      parameters:
        - $ref: "#/components/parameters/WebhookAccountIdQuery"
      responses:
        "200":
          description: Webhook endpoint 列表。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Webhook Endpoints
      summary: 创建 webhook endpoint
      operationId: createWebhookEndpoint
      description: body 省略 account_id 时创建工作空间端点；指定公开账号 ID 时创建该账号的独立端点。
        账号独立配置整体优先于工作空间配置，停用或未订阅某类事件不会回退；删除最后一个独立端点后，后续首次投递恢复继承。 account_id 只接受 body 中的非空字符串，不接受 query、null
        或重复字段。 字段名必须精确使用 account_id；body 或 query 中的大小写变体返回 400 invalid_request。 账号不存在或不属于当前工作空间返回 404
        account_not_found（20020）。 有效的账号配置请求直接创建账号端点，不改建为工作空间端点。 同一 account_id 最多一个 active 独立端点；创建
        status=active 时已有 active 端点返回 409 account_webhook_already_exists（40008）。 status=inactive 可创建多个，不占用
        active 名额。更换 URL 或其他配置使用 PATCH 更新已有端点。工作空间端点仍可配置多个；历史多 active 端点不会自动清理。 创建后应核对响应的 account_id；账号绑定不可通过
        PATCH 修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
      responses:
        "201":
          description: 创建成功。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BetaFeatureNotEnabled"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountWebhookAlreadyExists"
  /v1/webhook-endpoints/{endpoint_id}:
    get:
      tags:
        - Webhook Endpoints
      summary: 获取 webhook endpoint
      operationId: getWebhookEndpoint
      description: 按 endpoint_id 获取当前工作空间内的端点，包括工作空间和账号端点。 可选 query account_id 仅校验端点的账号归属；不匹配返回 400 invalid_request。
        显式账号不存在或不属于当前工作空间返回 404 account_not_found（20020）。 端点不存在时保持 HTTP 500
        get_webhook_endpoint_failed，numeric_code 为 40006。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/WebhookAccountIdQuery"
      responses:
        "200":
          description: Webhook endpoint 详情。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Webhook Endpoints
      summary: 更新 webhook endpoint
      operationId: updateWebhookEndpoint
      description: 提交 url、status 和需要保留的完整配置。省略 body account_id 时保留端点的已有归属。 提供 account_id
        仅校验原绑定一致；不允许切换账号、把工作空间端点改为账号端点或清空绑定。 account_id 不接受 query、null 或重复字段，归属不匹配返回 400 invalid_request。
        字段名必须精确使用 account_id；body 或 query 中的大小写变体返回 400 invalid_request。 显式账号不存在或不属于当前工作空间返回 404
        account_not_found（20020）。 账号端点可直接从停用恢复启用，归属保持不变。 inactive 改为 active 时，账号已有其他 active 端点返回 409
        account_webhook_already_exists（40008）；原端点已为 active 且保持 active 时允许更新，包括历史多 active 配置。 省略 signing_secret
        关闭签名；省略 retry_policy 恢复默认策略；订阅数组整体替换。 端点不存在时保持 HTTP 500 update_webhook_endpoint_failed，numeric_code 为
        40006。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointRequest"
      responses:
        "200":
          description: 更新后的 webhook endpoint。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/BetaFeatureNotEnabled"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountWebhookAlreadyExists"
    delete:
      tags:
        - Webhook Endpoints
      summary: 删除 webhook endpoint
      operationId: deleteWebhookEndpoint
      description: 按 endpoint_id 幂等删除当前工作空间内的端点；可选 query account_id 仅校验原绑定。 已找到端点但账号归属不匹配返回 400
        invalid_request，不执行删除。 显式账号不存在或不属于当前工作空间返回 404 account_not_found（20020）。 端点确实不存在时返回
        204；删除账号最后一个独立端点后，后续首次投递恢复继承工作空间配置。 原端点尚未完成的投递停止，不转投工作空间；已经发出的 HTTP 请求无法撤回。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/WebhookAccountIdQuery"
      responses:
        "204":
          description: 删除成功，无响应体。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/webhook-endpoints/{endpoint_id}/deactivate:
    post:
      tags:
        - Webhook Endpoints
      summary: 停用 webhook endpoint
      operationId: deactivateWebhookEndpoint
      description: 停用当前工作空间内的端点；可选 query account_id 仅校验原绑定，不匹配返回 400 invalid_request。 显式账号不存在或不属于当前工作空间返回 404
        account_not_found（20020）。 停用账号全部独立端点表示暂停该账号回调，不恢复工作空间继承。 端点不存在时保持 HTTP 500
        deactivate_webhook_endpoint_failed，numeric_code 为 40006。
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - $ref: "#/components/parameters/WebhookAccountIdQuery"
      responses:
        "200":
          description: 停用后的 webhook endpoint。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ResponseMeta"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

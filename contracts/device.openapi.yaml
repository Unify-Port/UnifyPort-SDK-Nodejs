        type:
          type: string
          enum:
            - user
        name:
          type: string
          minLength: 1
          pattern: \S
          description: 已知的非空显示名称，可省略；不用于事件身份或排序。
    ConversationDisappearingMessagesChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - change_type
      properties:
        kind:
          type: string
          enum:
            - conversation_updated
        change_type:
          type: string

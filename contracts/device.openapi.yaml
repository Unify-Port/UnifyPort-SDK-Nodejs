        2XX:
          description: 业务方已接收并接受处理该事件，重复投递也应幂等接受。
  messageReferralUpdated:
    post:
      summary: 带广告归因信息的消息编辑事件
      description: 支持接收消息编辑中的广告归因信息，仅适用于 `provider=whatsapp`，不包含 `whatsapp-protocol`。 复用
        `message.updated`，编辑后的当前消息携带可用来源信息时附加 `data.message.referral`。 同时订阅
        `message.received`、`message.updated` 和 `conversation.history` 可处理新消息、编辑与历史批次。 `data.message.id`
        是被编辑消息的 ID；按顶层 `id` 对事件去重，按 `provider + account_id + data.conversation.id + data.message.id` 关联原消息。
        只合并本次提供的字段；缺失 `referral` 或其中字段不清空已有信息，也不把一次编辑的归因复制到其他消息。
      operationId: receiveMessageReferralUpdatedWebhook
